# Default values for the generic frappe-bench chart.
#
# The chart renders the *application tier* only: web (Granian), socketio,
# RQ workers, scheduler, nginx edge, a local OTLP relay collector, the shared
# sites PVC, and one HTTPRoute per site. The database and cache are addressed
# by Service name (see `backend`) and are expected to be provided separately
# (e.g. a MariaDB operator CR); nothing here creates them.

# Image pull secrets applied to every pod.
imagePullSecrets:
  - name: natindonesia

# The immutable runtime image: every long-lived process runs the same code.
runtime:
  repository: ghcr.io/natindonesia/fayolex-working-staging-runtime
  tag: latest
  pullPolicy: Always

# Frappe apps shipped as standalone OCI images and bind-mounted read-only into
# apps/<name> from subPath `opt/frappe/apps/<name>` (the shared build layout).
# `primary` marks the app whose package is imported first; the rest just have
# their directory on PYTHONPATH. Order matters for PYTHONPATH.
apps:
  - name: frappe
    primary: true
    image:
      repository: ghcr.io/natindonesia/fayolex-working-staging-frappe
      tag: latest-standalone
      pullPolicy: IfNotPresent
  - name: crm
    primary: false
    image:
      repository: ghcr.io/natindonesia/crm
      tag: latest-standalone
      pullPolicy: IfNotPresent

# Edge + collector + cache images.
images:
  nginx:
    repository: ghcr.io/natindonesia/frappe
    tag: latest-granian
    pullPolicy: Always
  redis:
    repository: redis
    tag: 7-alpine
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0
  rotel:
    repository: streamfold/rotel
    tag: latest
    digest: sha256:7a12878dae3dc494c27def53ebcccbdc18e13389ececf33abf116af3a07c3427
    pullPolicy: IfNotPresent

# Sites served by this bench. Each gets an HTTPRoute on the shared Gateway.
# `name` is the site directory (hostname) and the Host the probes send.
sites:
  - name: dev.natracker.com
    gateway:
      name: grafana
      namespace: observability
      sectionName: demo-natracker

# Shared sites/data volume. One PVC, read-write by the runtime, read-only by
# nginx/migrate.
sitesStorage:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ssd-hiiops
  size: 10Gi
  # Existing PVC name to reuse (empty = create `<release>-sites-data`).
  existingClaim: sites-data

# Backing services, addressed by Service name in this namespace.
backend:
  db:
    host: mariadb
    port: 3306
  redis:
    host: redis
    port: 6379

# Deploy a single-node Redis for cache/queue/pub-sub. Set false to use an
# external/operator-managed cache instead.
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Local OTLP relay: forwards traces/metrics/logs to the in-cluster otel-gateway.
otel:
  enabled: true
  engine: otelcol # Collector engine: "otelcol" (Go OTel Contrib) or "rotel" (Rust-native OTel)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Central gateway OTLP/HTTP endpoint.
  gatewayEndpoint: http://otel-gateway.observability.svc.cluster.local:4318
  # Secret (created out-of-band, never in Git) holding the writer bearer token.
  writerTokenSecret:
    name: otel-writer-token
    key: token
  # Resource attributes stamped on every signal.
  namespace: ""            # default: .Release.Namespace
  environment: ""          # default: derived from the namespace suffix
  hostName: frankfurt-2
  serverRegion: frankfurt-2

# NetworkPolicy guardrails. Cilium enforces these. CIDRs are cluster-specific
# and default to the Gcore Frankfurt layout.
networkPolicy:
  enabled: true
  podCidr: 172.16.0.0/18
  serviceCidr: 172.24.0.0/18
  nodeCidr: 192.168.10.0/24
  nodeLocalDnsVip: 169.254.20.10/32
  gatewayNamespace: envoy-gateway-system
  # Extra pod labels used to select the backing MariaDB pods (operator-managed
  # MariaDBs carry their own labels; default matches a plain `app: mariadb`).
  mariadbPodLabels:
    app: mariadb
  # Outbound SMTP submission for Frappe email. DISABLED BY DEFAULT.
  #
  # A Kubernetes NetworkPolicy cannot match a hostname, so enabling this allows
  # the port to ANY public destination outside the cluster CIDRs. On a Cilium
  # cluster prefer a cluster-scoped CiliumClusterwideNetworkPolicy with an
  # explicit system-namespace exclusion (see the infrastructure-playbook repo,
  # gitops/kube-system/cluster-egress-policies). Enabling both would make a
  # hostname-scoped grant meaningless, because NetworkPolicy rules are
  # additive: egress becomes "any host on this port".
  #
  # Ports 25 and 465 are often filtered upstream (Gcore edge); 2525 is the
  # submission port that works there.
  smtpEgress:
    enabled: false
    port: 2525
    cidr: 0.0.0.0/0

# Node placement defaults applied to all bench workloads (web, workers, nginx, redis, etc.)
nodeSelector: {}
affinity: {}
tolerations: []

# Per-process tuning.
web:
  replicas: 2
  servicePort: 8000
  args:
    - >-
      cd /home/frappe/frappe-bench/sites && . ../env/bin/activate && exec granian
      --interface wsgi --host 0.0.0.0 --port 8000 --workers 2 --blocking-threads 4
      frappe.otel_wsgi:application
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  otelFrappeDbStatements: "0"
  startupProbe:
    periodSeconds: 1
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6

socketio:
  replicas: 1
  servicePort: 9000
  # Base URL socketio uses to authenticate users against the Frappe web tier.
  # Empty means in-cluster http://web:<web.servicePort>, which avoids hairpin
  # loopback through the public ingress when the socketio pod calls back to
  # the site (realtime auth).
  backendUrl: ""
  args:
    - >-
      cd /home/frappe/frappe-bench && . env/bin/activate && exec node
      apps/frappe/socketio.js
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# RQ worker queues keyed by name; each becomes Deployment `worker-<name>`.
workers:
  default:
    replicas: 1
    workerPool: true
    numWorkers: 2
    nofork: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

scheduler:
  replicas: 1
  args:
    - >-
      cd /home/frappe/frappe-bench && . env/bin/activate && python -c
      "from frappe.otel import boot; boot()" && exec bench schedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nginx:
  replicas: 1
  servicePort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Request timeout on the non-socket.io route.
  requestTimeout: 120s

# Optional MariaDB operator cluster deployment (CR).
mariadb:
  operator:
    enabled: false
    image: mariadb:11.4
    replicas: 1
    storageSize: 10Gi
    storageClassName: ssd-hiiops-retain

# Global common_site_config.json configuration applied during migrate job
commonSiteConfig:
  max_queued_jobs: 50000

# Default outgoing mail for every site in the bench.
#
# Frappe resolves the outgoing account in this order:
#   1. a DB `Email Account` with `default_outgoing = 1`
#   2. `EmailAccount.find_from_config()` -> the `mail_*` keys this block writes
#      into common_site_config.json
#   3. a dummy notifications@example.com account (mail fails, queue backs up)
#
# Step 2 is bench-wide, so enabling this makes *every* site send mail —
# including sites created after this release — with no per-site step. A site
# that has its own default outgoing `Email Account` keeps it (step 1 wins).
#
# Credentials are NEVER part of values. They are read at migrate time from a
# Secret via secretKeyRef (normally a SealedSecret named
# `<canonical-name>-smtp`), so the git-tracked form stays a sealed blob.
smtp:
  enabled: false
  # Relay endpoint. The Gcore edge filters 25 and 465, and 465 is not
  # expressible from config at all (Frappe maps no `use_ssl_for_outgoing`
  # key), so use 2525 with STARTTLS.
  host: smtp.mailersend.net
  port: 2525
  useTls: true
  # Envelope From. MUST be set: without `auto_email_id` Frappe falls back to
  # `mail_login`, which is usually a provider login (e.g. MS_xxx@domain) and
  # not a deliverable sender, so relays reject the message.
  autoEmailId: ""
  # Display name for outgoing mail (`email_sender_name`).
  senderName: ""
  # Force the account's own email_id as the From header so callers cannot
  # override it with a domain the relay rejects.
  alwaysUseAccountEmailIdAsSender: true
  # Secret holding the credentials. Required when enabled.
  existingSecret: ""
  loginKey: mail_login
  passwordKey: mail_password
  # Bump this (any string) when you re-seal the credential. The credentials
  # themselves live in the Secret, so the checksum below cannot see a rotated
  # Secret; without a new value here the pods keep using the old password they
  # read at startup. Changing it rolls web/workers/scheduler/socketio.
  credentialVersion: ""

# Pre-sync release migration Job
migrateJob:
  enabled: true
  waitForDeps: true
  waitImage: busybox:1.36
  setupAssetsDir: true
  fixDbUsers: true
  # Validate every site_config.json encryption_key (44-char url-safe base64 of 32
  # bytes) before `bench migrate`. Fails the sync hook on a malformed key, which
  # otherwise only shows up at runtime as "Encryption key is in invalid format".
  # Missing keys are reported as warnings, never fatal.
  validateEncryptionKeys: true
  backoffLimit: 0

# Scheduled S3/Spaces backup CronJob
backup:
  enabled: false
  schedule: "0 * * * *"
  dbDumpImage: mariadb:11.4
  s3SyncImage: amazon/aws-cli:2.24.1
  # When false, only configs (site_config.json, common_site_config.json, apps.txt)
  # and MariaDB database dumps are backed up. Media attachments/uploaded files
  # (public/files, private/files) are skipped to avoid ballooning storage and transfer times.
  includeFiles: false
  # Optional Uptime Kuma push monitor URL for heartbeat & dead man's switch alerting.
  uptimeKumaPushUrl: ""
  # Prefer a namespace-scoped Secret for the push URL so its token stays out of Helm values.
  uptimeKumaPushSecretName: ""
  uptimeKumaPushSecretKey: url

# KEDA Autoscaling for Granian web and Redis RQ background workers
autoscaling:
  enabled: false

  adapter:
    image:
      repository: python
      tag: "3.12-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
    historyWindowSec: 1.0

  web:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    pollingInterval: 5
    cooldownPeriod: 60
    triggers:
      granianQueue:
        enabled: true
        targetValue: 10
      cpu:
        enabled: true
        targetAverageValue: "4"
    hpaBehavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Pods
            value: 1
            periodSeconds: 15
          - type: Percent
            value: 100
            periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 90
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 30
          - type: Percent
            value: 50
            periodSeconds: 30

  workers:
    default:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      pollingInterval: 5
      cooldownPeriod: 60
      triggers:
        redisQueue:
          enabled: true
          benchKey: "home-frappe-frappe-bench"
          queues:
            - name: default
              targetListLength: 15
            - name: long
              targetListLength: 5
            - name: short
              targetListLength: 15
        cpu:
          enabled: true
          targetUtilization: 80
      hpaBehavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          selectPolicy: Min
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
