{{- range .Values.sites }}
{{- $slug := default (.name | replace "." "-") (default .routeName .routeSlug) }}
{{- $gwName := default (default "grafana" (and $.Values.gateway $.Values.gateway.name)) (and .gateway .gateway.name) }}
{{- $gwNamespace := default (default "observability" (and $.Values.gateway $.Values.gateway.namespace)) (and .gateway .gateway.namespace) }}
{{- $gwSection := default (default "" (and $.Values.gateway $.Values.gateway.sectionName)) (and .gateway .gateway.sectionName) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $slug }}
  namespace: {{ include "frappe-bench.namespace" $ }}
  labels:
    {{- include "frappe-bench.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
      namespace: {{ $gwNamespace }}
      {{- if $gwSection }}
      sectionName: {{ $gwSection }}
      {{- end }}
  hostnames:
    - {{ .name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Origin
                value: {{ printf "https://%s" .name | quote }}
              - name: X-Frappe-Site-Name
                value: {{ .name }}
      backendRefs:
        - group: ""
          kind: Service
          name: socketio
          port: {{ $.Values.socketio.servicePort }}
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ $.Values.nginx.requestTimeout }}
      backendRefs:
        - group: ""
          kind: Service
          name: nginx
          port: {{ $.Values.nginx.servicePort }}
          weight: 1
---
{{- end }}
