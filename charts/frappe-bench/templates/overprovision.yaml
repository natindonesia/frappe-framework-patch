{{- if and .Values.overprovision .Values.overprovision.enabled }}
{{- $op := .Values.overprovision }}
{{- $requests := $op.resources | default (dict "requests" (.Values.web.resources.requests | default dict)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovision
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: overprovision
    app.kubernetes.io/name: {{ printf "%s-overprovision" (include "frappe-bench.canonicalName" .) }}
    app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  replicas: {{ $op.replicas }}
  selector:
    matchLabels:
      app: overprovision
  template:
    metadata:
      labels:
        app: overprovision
        app.kubernetes.io/name: {{ printf "%s-overprovision" (include "frappe-bench.canonicalName" .) }}
        app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    spec:
      {{- include "frappe-bench.podDefaults" . | nindent 6 }}
      priorityClassName: {{ $op.priorityClassName }}
      terminationGracePeriodSeconds: 0
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
      containers:
        - name: pause
          image: {{ include "frappe-bench.imageRef" $op.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $requests | nindent 12 }}
{{- end }}
