{{- if and .Values.autoscaling.enabled (or (and .Values.autoscaling.web .Values.autoscaling.web.enabled) (and .Values.autoscaling.adapter .Values.autoscaling.adapter.enabled)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: granian-adapter-script
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-granian-adapter" (include "frappe-bench.canonicalName" .) }}
    app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    {{- include "frappe-bench.labels" . | nindent 4 }}
data:
  adapter.py: |
    import http.server
    import urllib.request
    import json
    import time
    import threading
    import socket
    from collections import deque
    from datetime import datetime

    state = {
        "blocking_queue": 0.0,
        "sustained_queue": 0.0,
        "active_connections": 0.0,
        "handled_requests": 0.0,
        "workers_alive": 0,
        "last_updated": 0.0,
        "healthy": True
    }

    redis_state = {
        "queue_default": 0,
        "queue_long": 0,
        "queue_short": 0,
        "queue_total": 0,
        "max_queue_latency_sec": 0.0,
        "saturation_deficit": 0,
        "failed_jobs": 0,
        "workers_total": 0,
        "workers_busy": 0,
        "workers_idle": 0,
        "workers_busy_ratio": 0.0,
        "last_updated": 0.0
    }

    # Sliding window of (timestamp, blocking_queue) samples
    queue_history = deque()
    HISTORY_WINDOW_SEC = {{ default 1.0 .Values.autoscaling.adapter.historyWindowSec }}

    def poll_granian():
        global state, queue_history
        while True:
            try:
                now = time.time()
                req = urllib.request.Request("http://{{ default "web" .Values.web.serviceHost }}:{{ default 9090 .Values.web.metricsPort }}/metrics")
                with urllib.request.urlopen(req, timeout=1.0) as resp:
                    raw = resp.read().decode('utf-8', errors='ignore')
                
                bq = 0.0
                conn = 0.0
                reqs = 0.0
                workers = 0
                for line in raw.splitlines():
                    if line.startswith("granian_blocking_queue{"):
                        bq += float(line.split()[-1])
                    elif line.startswith("granian_connections_active{"):
                        conn += float(line.split()[-1])
                    elif line.startswith("granian_requests_handled{"):
                        reqs += float(line.split()[-1])
                    elif line.startswith("granian_blocking_threads{"):
                        workers += 1

                queue_history.append((now, bq))
                while queue_history and (now - queue_history[0][0]) > HISTORY_WINDOW_SEC:
                    queue_history.popleft()

                sustained_bq = min(sample[1] for sample in queue_history) if queue_history else bq

                state["blocking_queue"] = bq
                state["sustained_queue"] = sustained_bq
                state["active_connections"] = conn
                state["handled_requests"] = reqs
                state["workers_alive"] = workers
                state["last_updated"] = now
                state["healthy"] = True
            except Exception:
                # If web pod is scaled to 0 or restarting, adapter remains healthy
                state["blocking_queue"] = 0.0
                state["sustained_queue"] = 0.0
                state["active_connections"] = 0.0
                state["workers_alive"] = 0
                state["healthy"] = True
            time.sleep(0.2)

    def poll_redis():
        global redis_state
        bench_key = "{{ default "home-frappe-frappe-bench" .Values.autoscaling.adapter.benchKey }}"
        queues = ["default", "long", "short"]
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1.5)
                s.connect(("{{ .Values.backend.redis.host }}", {{ .Values.backend.redis.port }}))
                f = s.makefile("rb")

                def send_cmd(*parts):
                    payload = f"*{len(parts)}\r\n"
                    for p in parts:
                        payload += f"${len(str(p))}\r\n{p}\r\n"
                    s.sendall(payload.encode("utf-8"))

                def parse_resp():
                    line = f.readline()
                    if not line:
                        return None
                    line = line.rstrip(b"\r\n")
                    prefix = line[:1]
                    if prefix == b":":
                        return int(line[1:])
                    elif prefix in (b"+", b"-"):
                        return line[1:].decode("utf-8", errors="ignore")
                    elif prefix == b"$":
                        length = int(line[1:])
                        if length == -1:
                            return None
                        val = f.read(length)
                        f.read(2)
                        return val.decode("utf-8", errors="ignore")
                    elif prefix == b"*":
                        count = int(line[1:])
                        if count == -1:
                            return None
                        return [parse_resp() for _ in range(count)]
                    return None

                # 1. Pipeline queue lengths, oldest job IDs, failed count, workers set
                for q in queues:
                    send_cmd("LLEN", f"rq:queue:{bench_key}:{q}")
                for q in queues:
                    send_cmd("LINDEX", f"rq:queue:{bench_key}:{q}", 0)
                send_cmd("ZCARD", f"rq:failed:{bench_key}:default")
                send_cmd("SMEMBERS", "rq:workers")

                q_lens = [parse_resp() or 0 for _ in queues]
                q_heads = [parse_resp() for _ in queues]
                failed = parse_resp() or 0
                workers = parse_resp() or []

                # 2. Pipeline enqueued_at timestamps for oldest waiting jobs
                head_jobs = [j for j in q_heads if j]
                for j in head_jobs:
                    send_cmd("HGET", f"rq:job:{j}", "enqueued_at")
                head_times = [parse_resp() for _ in head_jobs]

                now = time.time()
                max_latency = 0.0
                for t in head_times:
                    if t:
                        try:
                            ts = datetime.fromisoformat(t.replace("Z", "+00:00")).timestamp()
                            max_latency = max(max_latency, max(0.0, now - ts))
                        except Exception:
                            pass

                # 3. Pipeline worker states
                if workers:
                    for w in workers:
                        send_cmd("HGET", w, "state")
                    states = [parse_resp() for _ in workers]
                    busy = states.count("busy")
                    idle = states.count("idle")
                else:
                    busy = 0
                    idle = 0

                q_total = sum(q_lens)
                # Saturation deficit: unserviced backlog when all workers are occupied
                if idle == 0 and busy > 0:
                    deficit = q_total
                else:
                    deficit = max(0, q_total - idle)

                s.close()
                redis_state["queue_default"] = q_lens[0]
                redis_state["queue_long"] = q_lens[1]
                redis_state["queue_short"] = q_lens[2]
                redis_state["queue_total"] = q_total
                redis_state["max_queue_latency_sec"] = round(max_latency, 2)
                redis_state["saturation_deficit"] = deficit
                redis_state["failed_jobs"] = failed
                redis_state["workers_total"] = len(workers)
                redis_state["workers_busy"] = busy
                redis_state["workers_idle"] = idle
                redis_state["workers_busy_ratio"] = round(busy / len(workers), 2) if workers else 0.0
                redis_state["last_updated"] = time.time()
            except Exception:
                pass
            time.sleep(1.0)

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200 if state["healthy"] else 500)
                self.end_headers()
                self.wfile.write(b"OK" if state["healthy"] else b"FAIL")
                return

            if self.path == "/metrics":
                lines = [
                    "# HELP granian_sustained_queue Sustained blocking queue depth",
                    "# TYPE granian_sustained_queue gauge",
                    f"granian_sustained_queue {state['sustained_queue']}",
                    "# HELP granian_blocking_queue Instant blocking queue depth",
                    "# TYPE granian_blocking_queue gauge",
                    f"granian_blocking_queue {state['blocking_queue']}",
                    "# HELP frappe_rq_queue_length Queue depth of Frappe RQ background queues",
                    "# TYPE frappe_rq_queue_length gauge",
                    'frappe_rq_queue_length{queue="default"} ' + str(redis_state["queue_default"]),
                    'frappe_rq_queue_length{queue="long"} ' + str(redis_state["queue_long"]),
                    'frappe_rq_queue_length{queue="short"} ' + str(redis_state["queue_short"]),
                    'frappe_rq_queue_length{queue="total"} ' + str(redis_state["queue_total"]),
                    "# HELP frappe_rq_max_queue_latency_seconds Oldest waiting job age across all queues",
                    "# TYPE frappe_rq_max_queue_latency_seconds gauge",
                    f"frappe_rq_max_queue_latency_seconds {redis_state['max_queue_latency_sec']}",
                    "# HELP frappe_rq_saturation_deficit Unserviced backlog when all workers are busy",
                    "# TYPE frappe_rq_saturation_deficit gauge",
                    f"frappe_rq_saturation_deficit {redis_state['saturation_deficit']}",
                    "# HELP frappe_rq_failed_jobs Number of failed jobs",
                    "# TYPE frappe_rq_failed_jobs gauge",
                    f"frappe_rq_failed_jobs {redis_state['failed_jobs']}",
                    "# HELP frappe_rq_workers Registered Frappe workers",
                    "# TYPE frappe_rq_workers gauge",
                    'frappe_rq_workers{state="total"} ' + str(redis_state["workers_total"]),
                    'frappe_rq_workers{state="busy"} ' + str(redis_state["workers_busy"]),
                    'frappe_rq_workers{state="idle"} ' + str(redis_state["workers_idle"])
                ]
                body = ("\n".join(lines) + "\n").encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            combined = dict(state)
            combined.update(redis_state)
            body = json.dumps(combined).encode('utf-8')
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    if __name__ == "__main__":
        t1 = threading.Thread(target=poll_granian, daemon=True)
        t1.start()
        t2 = threading.Thread(target=poll_redis, daemon=True)
        t2.start()
        server = http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: granian-adapter
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: granian-adapter
    app.kubernetes.io/name: {{ printf "%s-granian-adapter" (include "frappe-bench.canonicalName" .) }}
    app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  selector:
    app: granian-adapter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granian-adapter
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: granian-adapter
    app.kubernetes.io/name: {{ printf "%s-granian-adapter" (include "frappe-bench.canonicalName" .) }}
    app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: granian-adapter
  template:
    metadata:
      labels:
        app: granian-adapter
        app.kubernetes.io/name: {{ printf "%s-granian-adapter" (include "frappe-bench.canonicalName" .) }}
        app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    spec:
      {{- include "frappe-bench.podDefaults" . | nindent 6 }}
      containers:
        - name: adapter
          image: {{ include "frappe-bench.imageRef" .Values.autoscaling.adapter.image }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.autoscaling.adapter.image.pullPolicy }}
          command: ["python3", "-u", "/app/adapter.py"]
          resources:
            {{- toYaml .Values.autoscaling.adapter.resources | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: granian-adapter-script
{{- end }}
