{{- range $name, $w := .Values.workers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $name }}
  namespace: {{ include "frappe-bench.namespace" $ }}
  labels:
    app: worker-{{ $name }}
    {{- include "frappe-bench.labels" $ | nindent 4 }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      app: worker-{{ $name }}
  template:
    metadata:
      labels:
        app: worker-{{ $name }}
      annotations:
        checksum/site-config: {{ include "frappe-bench.configChecksum" $ | quote }}
    spec:
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds | default 60 }}
      {{- include "frappe-bench.podDefaults" $ | nindent 6 }}
      {{- with $w.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "frappe-bench.imageRef" $.Values.runtime }}
          imagePullPolicy: {{ $.Values.runtime.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          command: ["/bin/bash", "-c"]
          args:
            {{- if $w.args }}
            {{- toYaml $w.args | nindent 12 }}
            {{- else if or $w.workerPool $w.numWorkers }}
            - >-
              cd /home/frappe/frappe-bench/sites && . ../env/bin/activate && exec python -c
              "from frappe.otel import boot; boot(); import runpy, sys; sys.argv=[\"bench\", \"frappe\", \"worker-pool\", \"--num-workers\", \"{{ $w.numWorkers | default 2 }}\"{{ if $w.queue }}, \"--queue\", \"{{ $w.queue }}\"{{ end }}];
              runpy.run_module(\"frappe.utils.bench_helper\", run_name=\"__main__\")"
            {{- else }}
            - >-
              cd /home/frappe/frappe-bench/sites && . ../env/bin/activate && exec python -c
              "from frappe.otel import boot; boot(); import runpy, sys; sys.argv=[\"bench\", \"frappe\", \"worker\"{{ if $w.queue }}, \"--queue\", \"{{ $w.queue }}\"{{ end }}];
              runpy.run_module(\"frappe.utils.bench_helper\", run_name=\"__main__\")"
            {{- end }}
          env:
            - name: PYTHONPATH
              value: {{ include "frappe-bench.pythonPath" $ | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ if eq $name "default" }}{{ printf "%s-worker" (include "frappe-bench.canonicalName" $) | quote }}{{ else }}{{ printf "%s-worker-%s" (include "frappe-bench.canonicalName" $) $name | quote }}{{ end }}
            - name: OTEL_FRAPPE_DB_STATEMENTS
              value: "0"
            {{- if or $w.nofork (and (or $w.workerPool $w.numWorkers) (ne $w.nofork false)) }}
            - name: FRAPPE_BACKGROUND_WORKERS_NOFORK
              value: "1"
            {{- end }}
            {{- with $w.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            {{- include "frappe-bench.appVolumeMounts" $ | nindent 12 }}
      volumes:
        {{- include "frappe-bench.appVolumes" $ | nindent 8 }}
        - name: sites-data
          persistentVolumeClaim:
            claimName: {{ include "frappe-bench.sitesClaim" $ }}
---
{{- end }}
