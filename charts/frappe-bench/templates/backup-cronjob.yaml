{{- if and .Values.backup .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "frappe-bench.canonicalName" . }}-backup
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  schedule: {{ default "0 * * * *" .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "frappe-bench.canonicalName" . }}-backup
            app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
        spec:
          restartPolicy: OnFailure
          {{- include "frappe-bench.podDefaults" . | nindent 10 }}
          volumes:
            - name: backup-scratch
              emptyDir: {}
            - name: sites-data
              persistentVolumeClaim:
                claimName: {{ include "frappe-bench.sitesClaim" . }}
                readOnly: true
          initContainers:
            - name: db-dump
              image: {{ default "mariadb:11.4" .Values.backup.dbDumpImage }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  set -euo pipefail
{{- if or .Values.backup.uptimeKumaPushUrl .Values.backup.uptimeKumaPushSecretName }}
                  push_kuma() {
                    curl -fsS -G "${KUMA_PUSH_URL}" \
                      --data-urlencode "status=$1" \
                      --data-urlencode "msg=$2" \
                      --data-urlencode "ping=$3" || true
                  }
                  notify_failure() {
                    echo "MariaDB dump or config archive failed!" >&2
                    push_kuma down "MariaDB dump or config archive failed" 0
                  }
                  trap notify_failure ERR
{{- end }}

                  echo "$(date +%s)" > /backup/backup-started-at
                  TS="$(date -u +%Y%m%d_%H%M%S)"
                  OUT="/backup/{{ include "frappe-bench.canonicalName" . }}-db-${TS}.sql.gz"
                  echo "Starting hourly MariaDB dump -> ${OUT}"
                  mariadb-dump \
                    --host="${MYSQL_HOST}" \
                    --user=root \
                    --password="${MYSQL_ROOT_PASSWORD}" \
                    --single-transaction \
                    --quick \
                    --default-character-set=utf8mb4 \
                    --hex-blob \
                    --routines \
                    --triggers \
                    --events \
                    --all-databases | gzip -c > "${OUT}"
                  echo "MariaDB dump finished: $(ls -lh "${OUT}")"

                  echo "Checking /sites health and archiving configurations..."
                  if [ ! -f /sites/common_site_config.json ]; then
                    echo "FATAL: /sites/common_site_config.json missing! Volume may be unmounted or corrupt." >&2
{{- if or .Values.backup.uptimeKumaPushUrl .Values.backup.uptimeKumaPushSecretName }}
                    notify_failure
{{- end }}
                    exit 1
                  fi
                  CFG_OUT="/backup/{{ include "frappe-bench.canonicalName" . }}-configs-${TS}.tar.gz"
                  cd /sites
                  tar -czf "${CFG_OUT}" \
                    common_site_config.json \
                    $( [ -f apps.txt ] && echo "apps.txt" ) \
                    $(find . -maxdepth 2 -name "site_config.json" | sed 's|^\./||')
                  echo "Config archive created: $(ls -lh "${CFG_OUT}")"
                  DB_BYTES=$(wc -c < "${OUT}" | tr -d ' ')
                  CONFIG_BYTES=$(wc -c < "${CFG_OUT}" | tr -d ' ')
                  echo "Backup artifact sizes: db_bytes=${DB_BYTES}, config_bytes=${CONFIG_BYTES}, total_bytes=$((DB_BYTES + CONFIG_BYTES))"
              env:
                - name: MYSQL_HOST
                  value: {{ .Values.backend.db.host }}
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-mariadb" (include "frappe-bench.canonicalName" .)) .Values.backend.db.secretName }}
                      key: {{ default "mariadb-root-password" .Values.backend.db.secretKey }}
{{- if .Values.backup.uptimeKumaPushSecretName }}
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.uptimeKumaPushSecretName }}
                      key: {{ default "url" .Values.backup.uptimeKumaPushSecretKey }}
{{- else if .Values.backup.uptimeKumaPushUrl }}
                - name: KUMA_PUSH_URL
                  value: {{ .Values.backup.uptimeKumaPushUrl | quote }}
{{- end }}
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                - name: sites-data
                  mountPath: /sites
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          containers:
            - name: s3-sync
              image: {{ default "amazon/aws-cli:2.24.1" .Values.backup.s3SyncImage }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - sh
                - -eu
                - -c
                - |
                  set -eu
                  START_TS=$(cat /backup/backup-started-at)
                  HOUR="$(date -u +%H)"
{{- if or .Values.backup.uptimeKumaPushUrl .Values.backup.uptimeKumaPushSecretName }}
                  push_kuma() {
                    curl -fsS -G "${KUMA_PUSH_URL}" \
                      --data-urlencode "status=$1" \
                      --data-urlencode "msg=$2" \
                      --data-urlencode "ping=$3" || true
                  }
                  notify_failure() {
                    echo "S3 backup upload failed!" >&2
                    push_kuma down "S3 backup upload failed" 0
                  }
                  trap notify_failure ERR
{{- end }}
                  echo "Starting upload to S3: ${S3_ENDPOINT}/${S3_BUCKET}/${S3_PREFIX}/"

                  if [ ! -f /sites/common_site_config.json ]; then
                    echo "FATAL: /sites volume appears empty or missing! Aborting upload to protect remote backup." >&2
{{- if or .Values.backup.uptimeKumaPushUrl .Values.backup.uptimeKumaPushSecretName }}
                    notify_failure
{{- end }}
                    exit 1
                  fi

                  echo "1. Uploading database dump (Son - hourly)..."
                  aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                    s3 cp /backup/ "s3://${S3_BUCKET}/${S3_PREFIX}/mariadb/hourly/" --recursive --exclude "*" --include "*.sql.gz"

                  if [ "${HOUR}" = "00" ]; then
                    echo "2. Uploading database dump (Father - daily at 00:00 UTC)..."
                    aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                      s3 cp /backup/ "s3://${S3_BUCKET}/${S3_PREFIX}/mariadb/daily/" --recursive --exclude "*" --include "*.sql.gz"
                  fi

                  echo "3. Uploading configuration archive..."
                  aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                    s3 cp /backup/ "s3://${S3_BUCKET}/${S3_PREFIX}/configs/" --recursive --exclude "*" --include "*configs-*.tar.gz"

                  if [ "${HOUR}" = "00" ]; then
                    echo "3b. Uploading configuration archive (Father - daily at 00:00 UTC)..."
                    aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                      s3 cp /backup/ "s3://${S3_BUCKET}/${S3_PREFIX}/configs/daily/" --recursive --exclude "*" --include "*configs-*.tar.gz"
                  fi

                  echo "4. Copying active configuration files (root & per-site configs)..."
                  for cfg in common_site_config.json apps.txt; do
                    if [ -f "/sites/${cfg}" ]; then
                      aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                        s3 cp "/sites/${cfg}" "s3://${S3_BUCKET}/${S3_PREFIX}/sites/${cfg}"
                    fi
                  done

                  for site_dir in /sites/*/; do
                    site_name="$(basename "${site_dir}")"
                    if [ "${site_name}" != "assets" ] && [ -f "${site_dir}site_config.json" ]; then
                      echo "Copying site configuration for ${site_name}..."
                      aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                        s3 cp "${site_dir}site_config.json" "s3://${S3_BUCKET}/${S3_PREFIX}/sites/${site_name}/site_config.json"
                    fi
                  done

{{- if default false .Values.backup.includeFiles }}
                  echo "5. Syncing site uploaded files (includeFiles=true)..."
                  for site_dir in /sites/*/; do
                    site_name="$(basename "${site_dir}")"
                    if [ "${site_name}" != "assets" ]; then
                      echo "Syncing site files: ${site_name}..."
                      aws --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}" \
                        s3 sync "${site_dir}" "s3://${S3_BUCKET}/${S3_PREFIX}/sites/${site_name}/" \
                        --exclude "*locks*" \
                        --exclude "*cache*"
                    fi
                  done
{{- else }}
                  echo "5. Skipping uploaded media files (public/files, private/files) — includeFiles is false."
{{- end }}

                  DURATION=$(( $(date +%s) - START_TS ))
                  DB_FILE=$(find /backup -maxdepth 1 -type f -name '*.sql.gz' -print -quit)
                  CONFIG_FILE=$(find /backup -maxdepth 1 -type f -name '*configs-*.tar.gz' -print -quit)
                  DB_BYTES=$(wc -c < "${DB_FILE}" | tr -d ' ')
                  CONFIG_BYTES=$(wc -c < "${CONFIG_FILE}" | tr -d ' ')
                  TOTAL_BYTES=$((DB_BYTES + CONFIG_BYTES))
                  DURATION_MS=$((DURATION * 1000))
                  echo "Backup completed in ${DURATION}s: db_bytes=${DB_BYTES}, config_bytes=${CONFIG_BYTES}, artifact_bytes=${TOTAL_BYTES}"
{{- if or .Values.backup.uptimeKumaPushUrl .Values.backup.uptimeKumaPushSecretName }}
                  push_kuma up "Backup OK in ${DURATION}s: db_bytes=${DB_BYTES}, config_bytes=${CONFIG_BYTES}, artifact_bytes=${TOTAL_BYTES}" "${DURATION_MS}"
{{- end }}
              envFrom:
                - secretRef:
                    name: {{ default (printf "%s-backup-s3" (include "frappe-bench.canonicalName" .)) .Values.backup.secretName }}
{{- if .Values.backup.uptimeKumaPushSecretName }}
              env:
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.uptimeKumaPushSecretName }}
                      key: {{ default "url" .Values.backup.uptimeKumaPushSecretKey }}
{{- else if .Values.backup.uptimeKumaPushUrl }}
              env:
                - name: KUMA_PUSH_URL
                  value: {{ .Values.backup.uptimeKumaPushUrl | quote }}
{{- end }}
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                  readOnly: true
                - name: sites-data
                  mountPath: /sites
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
{{- end }}
