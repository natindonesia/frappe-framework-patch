{{- if .Values.migrateJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "frappe-bench.canonicalName" . }}-migrate
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: bench-migrate
    {{- include "frappe-bench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ default 0 .Values.migrateJob.backoffLimit }}
  template:
    metadata:
      labels:
        app: bench-migrate
        app.kubernetes.io/part-of: {{ include "frappe-bench.canonicalName" . }}
    spec:
      restartPolicy: Never
      {{- include "frappe-bench.podDefaults" . | nindent 6 }}
      {{- if .Values.migrateJob.waitForDeps }}
      initContainers:
        - name: wait-db-redis
          image: {{ default "busybox:1.36" .Values.migrateJob.waitImage }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.backend.db.host }}:{{ .Values.backend.db.port }}..."
              until nc -z {{ .Values.backend.db.host }} {{ .Values.backend.db.port }}; do sleep 2; done
              {{- if .Values.redis.enabled }}
              echo "Waiting for {{ .Values.backend.redis.host }}:{{ .Values.backend.redis.port }}..."
              until nc -z {{ .Values.backend.redis.host }} {{ .Values.backend.redis.port }}; do sleep 2; done
              {{- end }}
              echo "Dependencies ready"
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "frappe-bench.imageRef" .Values.runtime }}
          imagePullPolicy: {{ .Values.runtime.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml (default .Values.web.resources .Values.migrateJob.resources) | nindent 12 }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cd /home/frappe/frappe-bench
              . env/bin/activate

              {{- if .Values.migrateJob.setupAssetsDir }}
              # Ensure sites/assets layout matches the mounted OCI apps without building at runtime
              ASSETS_DIR="/home/frappe/frappe-bench/sites/assets"
              mkdir -p "$ASSETS_DIR"
              (
                cd "$ASSETS_DIR"
                {{- range .Values.apps }}
                [ -d "/home/frappe/frappe-bench/apps/{{ .name }}/{{ .name }}/public" ] && rm -rf {{ .name }} && ln -s /home/frappe/frappe-bench/apps/{{ .name }}/{{ .name }}/public {{ .name }}
                {{- end }}
              )
              {{- end }}

              {{- if .Values.migrateJob.fixDbUsers }}
              # Self-heal MariaDB user scope before migrating
              if [ -f /scripts/fix-db-users.sh ]; then
                bash /scripts/fix-db-users.sh
              fi
              {{- end }}

              {{- if .Values.commonSiteConfig }}
              echo "Applying common_site_config settings..."
              {{- range $k, $v := .Values.commonSiteConfig }}
              bench set-config -g --parse {{ $k }} {{ $v | quote }}
              {{- end }}
              {{- end }}

              {{- if .Values.smtp.enabled }}
              # Default outgoing mail. These keys live in common_site_config.json,
              # so every site in the bench (including ones created later) inherits
              # them through EmailAccount.find_from_config().
              #
              # `--parse` runs ast.literal_eval, so it is used only for the
              # int/bool keys. Credentials are passed verbatim: a quoted password
              # would be stored with the quotes, and an unquoted one that happens
              # to look like a literal could be mangled.
              if [ -z "${SMTP_LOGIN:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
                echo "FATAL: smtp.enabled is true but SMTP_LOGIN/SMTP_PASSWORD are empty." >&2
                echo "Check that the Secret named in smtp.existingSecret carries the smtp.loginKey and smtp.passwordKey keys." >&2
                exit 1
              fi
              echo "Applying default outgoing mail settings..."
              bench set-config -g mail_server {{ .Values.smtp.host | quote }}
              bench set-config -g mail_port {{ .Values.smtp.port | quote }} --parse
              {{- if .Values.smtp.useTls }}
              bench set-config -g use_tls 1 --parse
              {{- end }}
              bench set-config -g mail_login "$SMTP_LOGIN"
              bench set-config -g mail_password "$SMTP_PASSWORD"
              {{- if .Values.smtp.autoEmailId }}
              bench set-config -g auto_email_id {{ .Values.smtp.autoEmailId | quote }}
              {{- end }}
              {{- if .Values.smtp.senderName }}
              bench set-config -g email_sender_name {{ .Values.smtp.senderName | quote }}
              {{- end }}
              {{- if .Values.smtp.alwaysUseAccountEmailIdAsSender }}
              bench set-config -g always_use_account_email_id_as_sender 1 --parse
              {{- end }}
              {{- end }}

              {{- if .Values.migrateJob.validateEncryptionKeys }}
              # Fail fast on malformed per-site secret material. A bad encryption_key
              # surfaces much later as "Encryption key is in invalid format" at runtime;
              # catching it here names the site and blocks a migrate on a broken bench.
              # A missing key is only a warning: `bench new-site` generates one.
              bad_keys=0
              checked_keys=0
              for cfg in sites/*/site_config.json; do
                [ -f "$cfg" ] || continue
                site=$(basename "$(dirname "$cfg")")
                if [ "$site" = "assets" ]; then continue; fi
                key=$(sed -n 's/.*"encryption_key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$cfg" | head -n1)
                if [ -z "$key" ]; then
                  echo "WARNING: $site has no encryption_key in site_config.json"
                  continue
                fi
                checked_keys=$((checked_keys + 1))
                if [ "${#key}" -ne 44 ]; then
                  echo "FATAL: $site encryption_key is ${#key} chars, expected 44 (url-safe base64 of 32 bytes)" >&2
                  bad_keys=$((bad_keys + 1))
                  continue
                fi
                key_bytes=$(printf '%s' "$key" | tr '_-' '/+' | base64 -d 2>/dev/null | wc -c)
                if [ "${key_bytes:-0}" -ne 32 ]; then
                  echo "FATAL: $site encryption_key does not decode to 32 bytes (got ${key_bytes:-0})" >&2
                  bad_keys=$((bad_keys + 1))
                fi
              done
              if [ "$bad_keys" -ne 0 ]; then
                echo "FATAL: $bad_keys site(s) have an invalid encryption_key; refusing to migrate." >&2
                echo "Fix: bench --site <site> set-config encryption_key \"\$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')\" then reseal the Secret it is sourced from." >&2
                exit 1
              fi
              echo "Validated encryption_key format for $checked_keys site(s)."
              {{- end }}

              echo "Starting bench migrate for all sites..."
              bench --site all migrate
              echo "Bench migrate completed successfully."
          envFrom:
            - configMapRef:
                name: frappe-env
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-mariadb" (include "frappe-bench.canonicalName" .)) .Values.backend.db.secretName }}
                  key: {{ default "mariadb-root-password" .Values.backend.db.secretKey }}
            - name: PYTHONPATH
              value: {{ include "frappe-bench.pythonPath" . | quote }}
            {{- if .Values.smtp.enabled }}
            # Non-optional refs: if the Secret is not there yet the pod stays in
            # CreateContainerConfigError instead of silently shipping a bench
            # with no working outgoing mail. Apply the SealedSecret in its own
            # revision so the controller has produced the Secret before a sync
            # needs it.
            - name: SMTP_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ required "smtp.existingSecret is required when smtp.enabled" .Values.smtp.existingSecret }}
                  key: {{ .Values.smtp.loginKey }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: {{ .Values.smtp.passwordKey }}
            {{- end }}
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            {{- include "frappe-bench.appVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "frappe-bench.appVolumes" . | nindent 8 }}
        - name: sites-data
          persistentVolumeClaim:
            claimName: {{ include "frappe-bench.sitesClaim" . }}
{{- end }}
