{{- if .Values.otel.enabled }}
{{- $isRotel := eq (.Values.otel.engine | default "otelcol") "rotel" }}
{{- if not $isRotel }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: otel-collector
    {{- include "frappe-bench.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: {{ dig "memoryLimiter" "limitMib" 400 .Values.otel }}
        spike_limit_mib: {{ dig "memoryLimiter" "spikeLimitMib" 100 .Values.otel }}
      batch:
        timeout: 1s
        send_batch_size: 2048
      resource/stack:
        attributes:
          - key: service.namespace
            value: {{ include "frappe-bench.otelNamespace" . }}
            action: upsert
          - key: deployment.environment
            value: {{ include "frappe-bench.otelEnvironment" . }}
            action: upsert
          - key: host.name
            value: {{ .Values.otel.hostName }}
            action: upsert
          - key: server.region
            value: {{ .Values.otel.serverRegion }}
            action: upsert
      attributes/scrub:
        actions:
          - action: delete
            pattern: "(?i)^http\\.(request|response)\\.header\\..*(authorization|cookie|api[-_]?key|auth[-_]?token|token|secret|password|session|csrf|jwt|bearer).*$"
          - action: delete
            pattern: "(?i)^http\\.(request|response)\\.header\\.(x-(amz|goog|ms|amzn)-|.*-signature).*$"
    exporters:
      otlphttp/central:
        endpoint: {{ .Values.otel.gatewayEndpoint }}
        tls:
          insecure: true
        headers:
          Authorization: "Bearer ${OTEL_WRITER_TOKEN}"
        sending_queue:
          enabled: true
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 0
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/stack, attributes/scrub, batch]
          exporters: [otlphttp/central]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/stack, attributes/scrub, batch]
          exporters: [otlphttp/central]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/stack, attributes/scrub, batch]
          exporters: [otlphttp/central]
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: otel-collector
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: otel-collector
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      {{- include "frappe-bench.podDefaults" . | nindent 6 }}
      containers:
        - name: otel-collector
          {{- if $isRotel }}
          image: {{ include "frappe-bench.imageRef" (.Values.images.rotel | default (dict "repository" "streamfold/rotel" "tag" "latest" "digest" "sha256:7a12878dae3dc494c27def53ebcccbdc18e13389ececf33abf116af3a07c3427" "pullPolicy" "IfNotPresent")) }}
          imagePullPolicy: {{ (.Values.images.rotel).pullPolicy | default "IfNotPresent" }}
          env:
            - name: ROTEL_EXPORTER
              value: "otlp"
            - name: ROTEL_OTLP_EXPORTER_ENDPOINT
              value: {{ .Values.otel.gatewayEndpoint | quote }}
            - name: ROTEL_OTLP_EXPORTER_PROTOCOL
              value: "http"
            - name: ROTEL_OTLP_EXPORTER_CUSTOM_HEADERS
              value: "Authorization=Bearer $(OTEL_WRITER_TOKEN)"
            - name: ROTEL_OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=%s,deployment.environment=%s,host.name=%s,server.region=%s" (include "frappe-bench.otelNamespace" .) (include "frappe-bench.otelEnvironment" .) .Values.otel.hostName .Values.otel.serverRegion | quote }}
            - name: OTEL_WRITER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.writerTokenSecret.name }}
                  key: {{ .Values.otel.writerTokenSecret.key }}
          resources:
            {{- toYaml (.Values.otel.resources | default (dict "requests" (dict "cpu" "100m" "memory" "64Mi") "limits" (dict "cpu" "2" "memory" "256Mi"))) | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 4318
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 30
          {{- else }}
          image: {{ include "frappe-bench.imageRef" .Values.images.otelCollector }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.otel.gomemlimit | default "300MiB" | quote }}
            - name: OTEL_WRITER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.writerTokenSecret.name }}
                  key: {{ .Values.otel.writerTokenSecret.key }}
          resources:
            {{- toYaml (.Values.otel.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "1" "memory" "512Mi"))) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          {{- end }}
      {{- if not $isRotel }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
      {{- end }}
{{- end }}
