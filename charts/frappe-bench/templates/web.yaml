apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: web
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - name: http
      port: {{ .Values.web.servicePort }}
      targetPort: {{ .Values.web.servicePort }}
    {{- if default true .Values.web.metricsPort }}
    - name: metrics
      port: {{ default 9090 .Values.web.metricsPort }}
      targetPort: {{ default 9090 .Values.web.metricsPort }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ include "frappe-bench.namespace" . }}
  labels:
    app: web
    {{- include "frappe-bench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        checksum/site-config: {{ include "frappe-bench.configChecksum" . | quote }}
    spec:
      {{- include "frappe-bench.podDefaults" . | nindent 6 }}
      {{- with .Values.web.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
          - name: net.ipv4.tcp_fin_timeout
            value: "10"
      containers:
        - name: web
          image: {{ include "frappe-bench.imageRef" .Values.runtime }}
          imagePullPolicy: {{ .Values.runtime.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          command: ["/bin/bash", "-c"]
          args:
            {{- toYaml .Values.web.args | nindent 12 }}
          env:
            - name: PYTHONPATH
              value: {{ include "frappe-bench.pythonPath" . | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-web" (include "frappe-bench.canonicalName" .) | quote }}
            - name: OTEL_FRAPPE_DB_STATEMENTS
              value: {{ .Values.web.otelFrappeDbStatements | quote }}
          ports:
            - containerPort: {{ .Values.web.servicePort }}
              name: http
            {{- if default true .Values.web.metricsPort }}
            - containerPort: {{ default 9090 .Values.web.metricsPort }}
              name: metrics
            {{- end }}
          startupProbe:
            {{- if and .Values.web.startupProbe (or .Values.web.startupProbe.httpGet .Values.web.startupProbe.tcpSocket .Values.web.startupProbe.exec) }}
            {{- toYaml .Values.web.startupProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /api/method/ping
              port: {{ .Values.web.servicePort }}
              httpHeaders:
                - name: Host
                  value: {{ include "frappe-bench.primaryHost" . }}
            periodSeconds: {{ default 1 (and .Values.web.startupProbe .Values.web.startupProbe.periodSeconds) }}
            timeoutSeconds: {{ default 5 (and .Values.web.startupProbe .Values.web.startupProbe.timeoutSeconds) }}
            failureThreshold: {{ default 30 (and .Values.web.startupProbe .Values.web.startupProbe.failureThreshold) }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          readinessProbe:
            {{- if and .Values.web.readinessProbe (or .Values.web.readinessProbe.httpGet .Values.web.readinessProbe.tcpSocket .Values.web.readinessProbe.exec) }}
            {{- toYaml .Values.web.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /api/method/ping
              port: {{ .Values.web.servicePort }}
              httpHeaders:
                - name: Host
                  value: {{ include "frappe-bench.primaryHost" . }}
            periodSeconds: {{ default 5 (and .Values.web.readinessProbe .Values.web.readinessProbe.periodSeconds) }}
            timeoutSeconds: {{ default 5 (and .Values.web.readinessProbe .Values.web.readinessProbe.timeoutSeconds) }}
            failureThreshold: {{ default 6 (and .Values.web.readinessProbe .Values.web.readinessProbe.failureThreshold) }}
            {{- end }}
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            {{- include "frappe-bench.appVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "frappe-bench.appVolumes" . | nindent 8 }}
        - name: sites-data
          persistentVolumeClaim:
            claimName: {{ include "frappe-bench.sitesClaim" . }}
