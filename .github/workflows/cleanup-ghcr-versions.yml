# Weekly hygiene for the GHCR packages: delete package versions older than
# CLEANUP_MAX_AGE_DAYS that the current release no longer references, keeping
# everything the current tags (latest / base / latest-granian and their per-arch
# children latest-amd64 / latest-arm64 / …) resolve to plus their cosign
# signatures and attestations — regardless of age — and every immutable release
# tag (<version>, <version>-base, <version>-granian and their -amd64 / -arm64
# children). This removes the sha256-<digest> versions GHCR auto-lists for
# retired signature/attestation manifests (the visible package-page noise).
# The per-arch tags are permanent by design: every multi-arch index references
# its child manifests by digest, so pruning them would break the index.
# There is no build-cache package to prune: the layer cache lives on the
# runner's Blacksmith sticky disk, not in a registry.
name: Cleanup GHCR package versions

on:
  schedule:
    # 04:17 UTC daily; cheap, idempotent, protected digests always spared.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report deletions without deleting
        required: false
        default: true
        type: boolean

permissions:
  # GITHUB_TOKEN may delete versions of packages linked to this repository.
  packages: write

concurrency:
  group: cleanup-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: 'Prune stale package versions (frappe)'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup scripts
        uses: actions/checkout@v7
        with:
          submodules: false
      # Digest resolution via docker buildx imagetools inspect needs registry
      # auth when the package is private (public packages work anonymously).
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable release tags (<version>, <version>-base, <version>-granian and
      # their -amd64 / -arm64 children) are permanent: they survive after the
      # floating tags move to a newer release. The arch children must outlive the
      # tag too, because each multi-arch index points at them by digest.
      - name: Prune frappe (multi-arch tags and their per-arch children protected)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          KEEP_TAG_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+(-base|-granian)?(-(amd64|arm64))?$'
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            bash scripts/ci/ghcr-cleanup.sh --dry-run \
              "${{ vars.SECONDARY_REGISTRY_NAMESPACE || github.repository_owner }}" frappe \
              latest base latest-granian \
              latest-amd64 latest-arm64 \
              base-amd64 base-arm64 \
              latest-granian-amd64 latest-granian-arm64
          else
            bash scripts/ci/ghcr-cleanup.sh \
              "${{ vars.SECONDARY_REGISTRY_NAMESPACE || github.repository_owner }}" frappe \
              latest base latest-granian \
              latest-amd64 latest-arm64 \
              base-amd64 base-arm64 \
              latest-granian-amd64 latest-granian-arm64
          fi
