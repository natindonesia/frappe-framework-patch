# Consolidated Docker + Granian pipeline. Each stage is a separate Actions job.
# Images are transferred as artifacts so dependent jobs test and publish the
# exact images built by the preceding jobs; no temporary registry tags exist.
name: Build & Test Docker and Granian Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push to Registry
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  REGISTRY_URL: ${{ vars.REGISTRY_URL || 'registry.digitalocean.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'natindonesia' }}

concurrency:
  group: build-images-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # STAGE 1: build and smoke-test the vanilla image.
  vanilla:
    name: 'Stage 1 - Vanilla build and smoke tests'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build patched Docker image (frappe:latest)
        run: bash scripts/ci/vanilla-build.sh
      - name: Build unpatched base Docker image (frappe:base)
        run: bash scripts/ci/base-build.sh
      - name: Verify base is unpatched and latest is patched
        run: bash scripts/ci/base-verify.sh
      - name: Test Nginx runtime and assets
        run: bash scripts/ci/vanilla-test-nginx.sh
      - name: Test Socket.IO runtime
        run: bash scripts/ci/vanilla-test-socketio.sh
      - name: Test Gunicorn and Python runtime
        run: bash scripts/ci/vanilla-test-gunicorn.sh
      - name: Test Queue and Worker runtime
        run: bash scripts/ci/vanilla-test-worker.sh
      - name: Export tested vanilla and base images
        run: docker save frappe:latest frappe:base | gzip -1 > /tmp/frappe-vanilla.tar.gz
      - name: Upload tested vanilla image
        uses: actions/upload-artifact@v4
        with:
          name: tested-vanilla-image
          path: /tmp/frappe-vanilla.tar.gz
          retention-days: 1

  # STAGE 2: load the tested vanilla image, layer Granian on it, then test it.
  granian:
    name: 'Stage 2 - Granian build and image validation'
    needs: vanilla
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Download tested vanilla image
        uses: actions/download-artifact@v4
        with:
          name: tested-vanilla-image
          path: /tmp
      - name: Load tested vanilla image
        run: gunzip -c /tmp/frappe-vanilla.tar.gz | docker load
      - name: Build Granian image layered on tested vanilla image
        run: bash scripts/ci/granian-build.sh
      - name: Verify Granian installation and image size
        run: bash scripts/ci/granian-verify.sh
      - name: Export tested images
        run: docker save frappe:latest frappe:base frappe-granian:latest | gzip -1 > /tmp/tested-images.tar.gz
      - name: Upload tested images
        uses: actions/upload-artifact@v4
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp/tested-images.tar.gz
          retention-days: 1

  # STAGE 3: run the complete vanilla and Granian integration suites.
  integration:
    name: 'Stage 3 - Compose, OTEL, CRUD, and teardown tests'
    needs: granian
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp
      - name: Load tested images
        run: gunzip -c /tmp/tested-images.tar.gz | docker load

      - name: Vanilla cleanup
        env: { CI_PROJECT: ci-otel }
        run: bash scripts/ci/compose-cleanup.sh -v
      - name: Vanilla start dependencies
        env: { CI_PROJECT: ci-otel, HTTP_PORT: '18085' }
        run: bash scripts/ci/compose-start-deps.sh
      - name: Vanilla run init
        env: { CI_PROJECT: ci-otel, HTTP_PORT: '18085', OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 }
        run: bash scripts/ci/compose-init.sh
      - name: Vanilla start application stack
        env: { CI_PROJECT: ci-otel, HTTP_PORT: '18085', OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318, NGINX_OTEL_ENDPOINT: otel-collector:4317 }
        run: bash scripts/ci/compose-start-stack.sh
      - name: Vanilla wait for readiness
        env: { CI_PROJECT: ci-otel }
        run: bash scripts/ci/compose-wait-web.sh
      - name: Vanilla assert OTEL spans
        env: { CI_PROJECT: ci-otel }
        run: bash scripts/ci/compose-otel-spans.sh
      - name: Vanilla assert OTEL gate-off
        env: { CI_PROJECT: ci-otel, HTTP_PORT: '18085', OTEL_EXPORTER_OTLP_ENDPOINT: '', NGINX_OTEL_ENDPOINT: '' }
        run: bash scripts/ci/compose-gate-off.sh
      - name: Vanilla diagnostics on failure
        if: failure()
        env: { CI_PROJECT: ci-otel }
        run: bash scripts/ci/compose-diag.sh
      - name: Vanilla teardown
        if: always()
        env: { CI_PROJECT: ci-otel }
        run: bash scripts/ci/compose-teardown.sh

      - name: Granian cleanup
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/compose-cleanup.sh
      - name: Granian start dependencies
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml, HTTP_PORT: '18086' }
        run: bash scripts/ci/compose-start-deps.sh
      - name: Granian run init
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml, HTTP_PORT: '18086', OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 }
        run: bash scripts/ci/compose-init.sh
      - name: Granian start application stack
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml, HTTP_PORT: '18086', OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318, NGINX_OTEL_ENDPOINT: otel-collector:4317 }
        run: bash scripts/ci/compose-start-stack.sh
      - name: Granian wait for readiness
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml, CI_WAIT_ROUNDS: '120' }
        run: bash scripts/ci/compose-wait-web.sh
      - name: Granian assert serving process
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/granian-verify-serving.sh
      - name: Granian assert pong API
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/granian-pong.sh
      - name: Granian assert OTEL spans
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/compose-otel-spans.sh
      - name: Granian assert CRUD
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/granian-crud.sh
      - name: Granian diagnostics on failure
        if: failure()
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/compose-diag.sh
      - name: Granian teardown
        if: always()
        env: { CI_PROJECT: ci-granian, EXTRA_FILES: resources/compose.granian-ci.yml }
        run: bash scripts/ci/compose-teardown.sh

  # STAGE 4: publish only after every build and integration test passes.
  publish:
    name: 'Stage 4 - Publish latest tags and verify digests'
    needs: integration
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push_to_registry == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp
      - name: Load tested images
        run: gunzip -c /tmp/tested-images.tar.gz | docker load
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Publish patched latest
        run: bash scripts/ci/publish-vanilla.sh
      - name: Publish unpatched base
        run: bash scripts/ci/publish-base.sh
      - name: Publish Granian latest-granian
        run: bash scripts/ci/publish-granian.sh
      - name: Verify published tags have distinct digests
        run: bash scripts/ci/publish-verify.sh