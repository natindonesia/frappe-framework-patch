# Consolidated Docker + Granian pipeline. The three published variants
# (base / latest / latest-granian) are built+pre-validated in ONE job and
# transferred as an exact Docker archive; then a single common test contract
# runs against ALL THREE via a matrix; security scanning (Semgrep OWASP Top 10
# + CWE Top 25 SAST, Trivy source/config, and Trivy image scans) runs in
# parallel; publish happens only after every matrix entry AND every security
# job passes. No downstream rebuild, no temporary registry tags.
# Publish promotes those exact tested images to BOTH the primary registry
# (registry.digitalocean.com) and the GitHub Container Registry (ghcr.io).
name: Build & Test Docker and Granian Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push to Registry
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  # Pinned security-scanner versions (upgrades are explicit). Leave
  # SEMGREP_VERSION empty to track the latest Semgrep release/rules.
  TRIVY_VERSION: 0.74.0
  SEMGREP_VERSION: ''
  # Fail the security jobs on HIGH/CRITICAL findings for Trivy and ERROR-level
  # Semgrep findings. Set SECURITY_FAIL_ON_FINDINGS=false (Trivy) to report only.
  SECURITY_SEVERITY: CRITICAL,HIGH
  SEMGREP_SEVERITY: ERROR
  REGISTRY_URL: ${{ vars.REGISTRY_URL || 'registry.digitalocean.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'natindonesia' }}
  # Optional SECOND registry (GitHub Container Registry by default). Set the
  # variable SECONDARY_REGISTRY_URL to empty to publish to the primary only.
  SECONDARY_REGISTRY_URL: ${{ vars.SECONDARY_REGISTRY_URL || 'ghcr.io' }}
  SECONDARY_REGISTRY_NAMESPACE: ${{ vars.SECONDARY_REGISTRY_NAMESPACE || github.repository_owner }}

concurrency:
  group: build-images-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # STAGE 1: build base + latest, build latest-granian FROM the tested local
  # latest, pre-validate each, then export the exact three images.
  images:
    name: 'Build + pre-validate base/latest/latest-granian'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build patched Docker image (frappe:latest)
        run: bash scripts/ci/vanilla-build.sh
      - name: Build unpatched base Docker image (frappe:base)
        run: bash scripts/ci/base-build.sh
      - name: Pre-validate base unpatched and latest patched
        run: bash scripts/ci/base-verify.sh
      - name: Pre-validate Nginx runtime and assets (latest)
        run: bash scripts/ci/vanilla-test-nginx.sh
      - name: Pre-validate Socket.IO runtime (latest)
        run: bash scripts/ci/vanilla-test-socketio.sh
      - name: Pre-validate Gunicorn and Python runtime (latest)
        run: bash scripts/ci/vanilla-test-gunicorn.sh
      - name: Pre-validate Queue and Worker runtime (latest)
        run: bash scripts/ci/vanilla-test-worker.sh
      - name: Build Granian image layered on tested local frappe:latest
        run: bash scripts/ci/granian-build.sh
      - name: Pre-validate Granian installation and import
        run: bash scripts/ci/granian-verify.sh
      - name: Export tested base/latest/latest-granian images
        run: docker save frappe:latest frappe:base frappe-granian:latest | gzip -1 > /tmp/tested-images.tar.gz
      - name: Upload tested images
        uses: actions/upload-artifact@v7
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp/tested-images.tar.gz
          retention-days: 1

  # STAGE 2: run the SAME common compose/OTEL/CRUD contract against all three
  # variants. Consumes the exact archive; never rebuilds or pulls.
  variant-matrix:
    name: 'Matrix - common contract (${{ matrix.variant }})'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [base, latest, latest-granian]
    steps:
      - name: Checkout scripts and compose resources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp
      - name: Load tested images
        run: gunzip -c /tmp/tested-images.tar.gz | docker load
      - name: Run common contract for ${{ matrix.variant }}
        run: bash scripts/ci/matrix-variant-test.sh "${{ matrix.variant }}"

  # STAGE 2b: static application security testing. Semgrep is run against the
  # owned patch/script surface (not the checked-out Frappe submodule) using the
  # OWASP Top 10 and CWE Top 25 rule packs. Runs independent of the image build.
  sast:
    name: 'SAST - Semgrep OWASP Top 10 + CWE Top 25'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Run Semgrep SAST
        run: bash scripts/ci/security-scan-sast.sh
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/semgrep.sarif
          category: semgrep

  # STAGE 2c: dependency/secret/IaC scan of the checked-out source tree with
  # Trivy (no image required). Also independent of the image build.
  trivy-source:
    name: 'Security - Trivy source (deps, secrets, IaC)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Run Trivy filesystem + config scan
        run: bash scripts/ci/security-scan-source.sh
      - name: Upload Trivy filesystem SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-fs.sarif
          category: trivy-source-fs
      - name: Upload Trivy config SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-config.sarif
          category: trivy-source-config

  # STAGE 2d: container image scan of the EXACT tested images (vuln, secrets,
  # insecure config) before any publish. Consumes the same archive as the
  # variant matrix; never rebuilds.
  trivy-images:
    name: 'Security - Trivy images (vuln, secret, misconfig)'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp
      - name: Load tested images
        run: gunzip -c /tmp/tested-images.tar.gz | docker load
      - name: Run Trivy image scan
        run: bash scripts/ci/security-scan-images.sh frappe:latest frappe:base frappe-granian:latest
      - name: Upload Trivy image SARIF (latest)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-image-frappe_latest.sarif
          category: trivy-image-latest
      - name: Upload Trivy image SARIF (base)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-image-frappe_base.sarif
          category: trivy-image-base
      - name: Upload Trivy image SARIF (granian)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-image-frappe-granian_latest.sarif
          category: trivy-image-granian

  # STAGE 3: publish only after every matrix entry AND every security scan passes,
  # then verify digests.
  # The tested images are promoted byte-for-byte to BOTH registries: the primary
  # registry (DigitalOcean) and the GitHub Container Registry (ghcr.io).
  publish:
    name: 'Publish latest/base/latest-granian and verify digests'
    needs: [variant-matrix, sast, trivy-source, trivy-images]
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push_to_registry == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: tested-vanilla-and-granian-images
          path: /tmp
      - name: Load tested images
        run: gunzip -c /tmp/tested-images.tar.gz | docker load
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to GitHub Container Registry
        if: env.SECONDARY_REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SECONDARY_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish patched latest
        run: bash scripts/ci/publish-vanilla.sh
      - name: Publish unpatched base
        run: bash scripts/ci/publish-base.sh
      - name: Publish Granian latest-granian
        run: bash scripts/ci/publish-granian.sh
      - name: Verify published tags have distinct digests
        run: bash scripts/ci/publish-verify.sh
