# Consolidated Docker + Granian pipeline. The three published variants
# (base / latest / latest-granian) are built+pre-validated per ARCHITECTURE in
# ONE job each and transferred as exact Docker archives; then a single job per
# variant per architecture runs the common test contract AND the Trivy image
# scan against that exact archive. Static analysis (Semgrep OWASP Top 10 + CWE
# Top 25 SAST, Trivy source/config) runs in parallel; publish happens only after
# every matrix entry AND the static analysis pass. No downstream rebuild.
#
# MULTI-ARCH (linux/amd64 + linux/arm64):
#   * Each architecture is built NATIVELY on a runner of its own architecture —
#     x64 on `ubuntu-latest`, arm64 on `ubuntu-24.04-arm`. No QEMU: emulating
#     this `bench init` (pip + yarn over the whole app tree) costs 2-10x wall
#     clock and would not fit the timeout. This is the one intentional exception
#     to the "never ARM: container build" rule in infrastructure-playbook#53 §4:
#     that rule assumes an amd64 payload on an ARM runner (i.e. emulation),
#     whereas here the ARM runner produces an arm64 payload with its own
#     toolchain.
#   * GitHub-hosted, not Blacksmith: this repository is PUBLIC, so standard
#     GitHub-hosted minutes (amd64 and arm64 alike) cost nothing, while the same
#     jobs were ~$26/month of Blacksmith list price — half the org's entire
#     Blacksmith bill, for CI that GitHub gives away. That is why the fleet rule
#     in #53 is "private repos go to Blacksmith", not "everything does".
#   * The layer cache is the buildx builder's own state for the duration of the
#     job: base and latest share the pristine builder-base stages inside one
#     runner, so a patch edit never re-runs `bench init`. Nothing is written to
#     a registry and no gha cache is used, so there is no frappe-buildcache
#     package to store, prune or authenticate. A fresh runner per job means the
#     FIRST build on that runner is always cold; that is the price of not paying
#     for a sticky disk.
#   * GitHub's standard runner has ~14 GB of free workspace disk, not the 80 GB
#     a Blacksmith runner carries, while these legs build two multi-GB images
#     and a 1.3 GB archive. `Reclaim runner disk` therefore deletes the
#     preinstalled toolchains this pipeline never uses before anything is built.
#   * Each leg pushes single-arch manifests (`<tag>-amd64` / `<tag>-arm64`); the
#     merge job folds them into the multi-arch index under the published tag, so
#     `docker pull` selects the right platform automatically. The arch tags are
#     permanent because the index references its children by digest.
#
# Publish promotes those exact tested images to every configured registry: the
# optional primary (e.g. registry.digitalocean.com, only when REGISTRY_URL is
# set) and the GitHub Container Registry. An unavailable registry never blocks
# the other one; the job still fails so the breakage stays visible. Every run
# publishes immutable tags derived from the pinned Frappe version
# (<version>, <version>-base, <version>-granian); the floating latest / base /
# latest-granian only move from the default branch.
# Finally, the published GHCR digests are attested (SLSA provenance + one SPDX
# SBOM per platform), keylessly signed, and independently verified with a
# hard-fail gate.
name: Build & Test Docker and Granian Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'experiments/**'
      - 'charts/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/frappe-bench-chart.yml'
  pull_request:
    paths-ignore:
      - 'experiments/**'
      - 'charts/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/frappe-bench-chart.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push to Registry
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  # Pinned security-scanner versions (upgrades are explicit). Leave
  # SEMGREP_VERSION empty to track the latest Semgrep release/rules.
  TRIVY_VERSION: 0.74.0
  SEMGREP_VERSION: ''
  # Pinned cosign used to sign image digests and verify them again in the gate.
  COSIGN_VERSION: v3.1.3
  # Pinned syft used to generate the SBOM that is attested.
  SYFT_VERSION: v1.52.0
  # Fail the security jobs on HIGH/CRITICAL findings for Trivy and ERROR-level
  # Semgrep findings. Set SECURITY_FAIL_ON_FINDINGS=false (Trivy) to report only.
  SECURITY_SEVERITY: CRITICAL,HIGH
  SEMGREP_SEVERITY: ERROR
  # Registries. The GitHub Container Registry is always published (it is also
  # where attestations and signatures live) and needs no secret: the workflow
  # logs in with its own GITHUB_TOKEN and `permissions: packages: write`.
  # The OPTIONAL primary registry mirrors the same tested images elsewhere
  # (e.g. registry.digitalocean.com); it is used only when REGISTRY_URL is set.
  REGISTRY_URL: ${{ vars.REGISTRY_URL }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
  # The secondary registry is GHCR by default; publishing to it is skipped only
  # when SECONDARY_REGISTRY_URL is empty.
  SECONDARY_REGISTRY_URL: ${{ vars.SECONDARY_REGISTRY_URL || 'ghcr.io' }}
  SECONDARY_REGISTRY_NAMESPACE: ${{ vars.SECONDARY_REGISTRY_NAMESPACE || github.repository_owner }}
  # Every publish run emits immutable release tags derived from the pinned
  # Frappe version (<version>, <version>-base, <version>-granian). Only the
  # default branch may also advance the floating tags (latest / base /
  # latest-granian), so re-publishing an older release never moves them.
  PUBLISH_MOVING_TAGS: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

concurrency:
  group: build-images-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # STAGE 1: build base + latest, build latest-granian FROM the tested local
  # latest, pre-validate each, then export the exact three images — once per
  # architecture, natively.
  images:
    name: 'Build + pre-validate ${{ matrix.arch }} base/latest/latest-granian'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # Fail fast (and loudly) when the leg landed on the wrong runner: an
      # arm64 leg on an x64 runner would silently emulate the whole bench build.
      - name: Assert native architecture (no emulation)
        run: |
          set -euo pipefail
          case "$(docker info --format '{{.Architecture}}')" in
            x86_64 | amd64) have=amd64 ;;
            aarch64 | arm64) have=arm64 ;;
            *) have=unknown ;;
          esac
          if [ "$have" != "${{ matrix.arch }}" ]; then
            echo "::error::runner architecture is ${have}, this leg builds ${{ matrix.arch }} — refusing to build under emulation"
            echo "  amd64 leg -> ubuntu-latest; arm64 leg -> ubuntu-24.04-arm"
            exit 1
          fi
          echo "native ${{ matrix.arch }} runner confirmed"
      # A GitHub-hosted runner carries ~14 GB of free workspace disk, not the
      # 80 GB a Blacksmith runner has, and this job builds three multi-GB images
      # plus a 1.3 GB archive. Drop the preinstalled toolchains nothing here
      # uses; print free space on both sides so a future shortage is visible in
      # the log rather than appearing as a build-time ENOSPC.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          df -h / | sed -n '1,2p'
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | sed -n '1,2p'
      # Shallow on purpose: nothing in the build reads history (image metadata
      # comes from GITHUB_ENV, not `git describe`), and a full frappe/frappe
      # clone is 23-47 s on the longest path.
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set OCI image build metadata
        run: |
          {
            echo "IMAGE_REVISION=${GITHUB_SHA}"
            echo "IMAGE_VERSION=${GITHUB_REF_NAME}"
            echo "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}"
            echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "FRAPPE_SHA=$(git -C frappe rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      # The ONLY layer cache: this job's own buildx builder. No registry cache,
      # no gha cache — nothing is written to a registry, so there is no
      # frappe-buildcache package to store, prune or authenticate.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Build base FIRST so the shared pristine builder-base layers land in the
      # builder cache before the patched build consumes them.
      - name: Build unpatched base Docker image (frappe:base)
        run: bash scripts/ci/base-build.sh
      - name: Build patched Docker image layered on shared base (frappe:latest)
        run: bash scripts/ci/vanilla-build.sh
      - name: Pre-validate base unpatched and latest patched
        run: bash scripts/ci/base-verify.sh
      - name: Pre-validate patch delta (every patch present in latest, absent in base)
        run: bash scripts/ci/patch-delta-verify.sh
      - name: Pre-validate Nginx runtime and assets (latest)
        run: bash scripts/ci/vanilla-test-nginx.sh
      - name: Pre-validate Socket.IO runtime (latest)
        run: bash scripts/ci/vanilla-test-socketio.sh
      - name: Pre-validate Gunicorn and Python runtime (latest)
        run: bash scripts/ci/vanilla-test-gunicorn.sh
      - name: Pre-validate Queue and Worker runtime (latest)
        run: bash scripts/ci/vanilla-test-worker.sh
      - name: Build Granian image layered on tested local frappe:latest
        run: bash scripts/ci/granian-build.sh
      - name: Pre-validate Granian installation and import
        run: bash scripts/ci/granian-verify.sh
      # One compression pass, not two: zstd -T0 spreads the work over every
      # core, and the upload is told not to zlib the archive again (compression-
      # level 0). The old path gzipped on a single core here and then zipped the
      # result again inside upload-artifact, which was the longest single step on
      # the arm64 leg.
      - name: Export tested ${{ matrix.arch }} base/latest/latest-granian images
        run: |
          set -euo pipefail
          docker save frappe:latest frappe:base frappe-granian:latest \
            | zstd -T0 -3 -o /tmp/tested-images.tar.zst
          ls -lh /tmp/tested-images.tar.zst
      - name: Upload tested images
        uses: actions/upload-artifact@v7
        with:
          name: tested-images-${{ matrix.arch }}
          path: /tmp/tested-images.tar.zst
          compression-level: 0
          retention-days: 1

  # STAGE 2: the SAME common compose/OTEL/CRUD contract PLUS the Trivy image
  # scan, per variant per architecture. Both run against the image this job
  # already loaded from the tested archive, so the scan costs no extra
  # download/load and one runner does contract + scan instead of two jobs.
  variant-matrix:
    name: 'Matrix - contract + image scan (${{ matrix.arch }}, ${{ matrix.variant }})'
    needs: images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        variant: [base, latest, latest-granian]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Report-only: scan and upload results, but do not fail the job/publish.
      SECURITY_FAIL_ON_FINDINGS: false
    steps:
      # Same 14 GB workspace as the build legs, and this job loads a 1.3 GB
      # archive back into images before starting a compose stack.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules
          df -h / | sed -n '1,2p'
      - name: Checkout scripts and compose resources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Download tested ${{ matrix.arch }} images
        uses: actions/download-artifact@v8
        with:
          name: tested-images-${{ matrix.arch }}
          path: /tmp
      - name: Load tested images
        run: zstd -dc /tmp/tested-images.tar.zst | docker load
      - name: Run common contract for ${{ matrix.variant }} on ${{ matrix.arch }}
        run: bash scripts/ci/matrix-variant-test.sh "${{ matrix.variant }}"
      # The Trivy DB is ~250 MB and every scan job re-downloaded it. Restored
      # from cache, Trivy still checks freshness itself (>24 h re-downloads), so
      # a stale entry costs a metadata request, never a wrong scan.
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}-
      # Scan the exact image this job just tested (vuln + secret + misconfig).
      # The variant -> local tag mapping mirrors matrix-variant-test.sh.
      - name: Trivy image scan (${{ matrix.variant }} on ${{ matrix.arch }})
        run: |
          set -euo pipefail
          case "${{ matrix.variant }}" in
            base) image=frappe:base ;;
            latest) image=frappe:latest ;;
            latest-granian) image=frappe-granian:latest ;;
            *) echo "::error::unknown variant ${{ matrix.variant }}"; exit 2 ;;
          esac
          bash scripts/ci/security-scan-images.sh "$image"
          # Exactly one image is scanned here; normalise the report name.
          cp security-results/trivy-image-*.sarif security-results/trivy-image.sarif
      - name: Upload Trivy image SARIF (${{ matrix.variant }} on ${{ matrix.arch }})
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-image.sarif
          category: trivy-image-${{ matrix.variant }}-${{ matrix.arch }}

  # STAGE 2b: run the upstream Frappe test suite against the patched image.
  # The compose stack supplies MariaDB/Redis and an initialized site; tests
  # run inside the web container so they use exactly the image being published.
  upstream-tests:
    name: 'Upstream Frappe tests (latest, amd64)'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI_PROJECT: ci-upstream-tests
      FRAPPE_TEST_IMAGE: frappe:latest
      EXTRA_FILES: resources/compose.variant-ci.yml
      HTTP_PORT: 18087
      SITE_NAME: crm.localhost
      ADMIN_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
      DEVELOPER_MODE: "1"
    steps:
      - name: Checkout compose resources and CI helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Download tested amd64 images
        uses: actions/download-artifact@v8
        with:
          name: tested-images-amd64
          path: /tmp
      - name: Load tested images
        run: zstd -dc /tmp/tested-images.tar.zst | docker load
      - name: Start test stack
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          bash scripts/ci/compose-cleanup.sh -v
          bash scripts/ci/compose-start-deps.sh
          bash scripts/ci/compose-init.sh
          bash scripts/ci/compose-start-stack.sh
          bash scripts/ci/compose-wait-web.sh
      - name: Install upstream test dependencies
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          # The runtime image only installs production requirements. These are
          # Frappe's own `test`/`dev` extras needed by the suite (faker,
          # hypothesis, freezegun, responses, xmlrunner, pyngrok).
          compose exec -T web bash -lc '
            set -e
            cd /home/frappe/frappe-bench
            ./env/bin/pip install --quiet \
              "Faker~=18.10.1" \
              "hypothesis~=6.77.0" \
              "freezegun~=1.5.1" \
              "responses==0.23.1" \
              "unittest-xml-reporting~=3.2.0" \
              "pyngrok~=7.5.0"
          '
      - name: Configure test site for upstream tests
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          # Mirror the site configuration used by Frappe's own CI: CLI tests
          # need `allow_tests`/`root_*`, HTTP tests need a reachable host_name
          # and a mail account, and muting email keeps queued mail from being
          # delivered by the background workers during the run. The gunicorn
          # web tier already listens on 8000 inside this container, and
          # `crm.localhost` resolves to 127.0.0.1, so no extra server is needed.
          compose exec -T web bash -lc '
            set -e
            cd /home/frappe/frappe-bench
            bench --site crm.localhost set-config allow_tests 1 --parse
            bench --site crm.localhost set-config server_script_enabled 1 --parse
            bench --site crm.localhost set-config host_name "http://crm.localhost:8000"
            bench --site crm.localhost set-config auto_email_id "test@example.com"
            bench --site crm.localhost set-config mail_server localhost
            bench --site crm.localhost set-config mail_port 2525 --parse
            bench --site crm.localhost set-config mail_login "test@example.com"
            bench --site crm.localhost set-config mail_password admin
            bench --site crm.localhost set-config mute_emails 1 --parse
            bench --site crm.localhost set-config admin_password admin
            bench --site crm.localhost set-config root_login root
            bench --site crm.localhost set-config root_password admin
          '
      - name: Run upstream Frappe tests
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          for module in \
            frappe.tests.test_password \
            frappe.tests.test_password_strength \
            frappe.core.doctype.user.test_user
          do
            echo "::group::bench run-tests --module $module"
            compose exec -T web bash -lc \
              "cd /home/frappe/frappe-bench && bench --site crm.localhost run-tests --app frappe --module $module"
            echo "::endgroup::"
          done
          echo "::group::bench run-tests TestCommands.test_set_password"
          compose exec -T web bash -lc \
            'cd /home/frappe/frappe-bench && bench --site crm.localhost run-tests --app frappe --module frappe.commands.test_commands --case TestCommands --test test_set_password'
          echo "::endgroup::"

  # STAGE 2c: the FULL upstream Frappe test suite (~4k tests), sharded 2 ways
  # and run against both served variants. Same tested image archive as the
  # matrix; shards are file-list partitions of `run-parallel-tests`
  # (--build-number i of --total-builds 2), so each shard gets a disjoint set.
  # Two shards, not four: most of a shard's wall time is bring-up (compose,
  # site init, git baseline), so the fourth shard bought ~2 min of test time for
  # another full copy of that overhead. The suite is advisory and publish does
  # not wait on it.
  upstream-full-suite:
    name: 'Upstream Frappe suite (${{ matrix.variant }}, shard ${{ matrix.shard }}/2)'
    needs: images
    # ADVISORY: the production runtime image is still not a dev-parity
    # environment (no .git in apps/frappe, no writable source tree, PDF/attach
    # tooling differences). The remaining failures reproduce on the UNPATCHED
    # frappe:base image, so this job reports suite health without blocking
    # publish. Flip to blocking once those gaps close.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [latest, latest-granian]
        shard: [1, 2]
    env:
      CI_PROJECT: ci-upstream-${{ matrix.variant }}-${{ matrix.shard }}
      FRAPPE_TEST_IMAGE: ${{ matrix.variant == 'latest-granian' && 'frappe-granian:latest' || 'frappe:latest' }}
      EXTRA_FILES: ${{ matrix.variant == 'latest-granian' && 'resources/compose.variant-ci.yml resources/compose.upstream-ci.yml resources/compose.granian-ci.yml' || 'resources/compose.variant-ci.yml resources/compose.upstream-ci.yml' }}
      HTTP_PORT: 18089
      SITE_NAME: crm.localhost
      # Dev parity, not a dev bench: developer_mode=1 would let the suite
      # rewrite doctype/workspace files in the image and mask developer-only
      # assertions. With it off the install gate also requires a real
      # Administrator password, which is exactly what this job should prove.
      ADMIN_PASSWORD: Admin-Test-9f3K!
      MYSQL_ROOT_PASSWORD: admin
      DEVELOPER_MODE: "0"
      CI_WAIT_ROUNDS: ${{ matrix.variant == 'latest-granian' && 120 || 60 }}
    steps:
      - name: Checkout compose resources and CI helpers
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Download tested amd64 images
        uses: actions/download-artifact@v8
        with:
          name: tested-images-amd64
          path: /tmp
      - name: Load tested images
        run: zstd -dc /tmp/tested-images.tar.zst | docker load
      - name: Start test stack
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          bash scripts/ci/compose-cleanup.sh -v
          bash scripts/ci/compose-start-deps.sh
          bash scripts/ci/compose-init.sh
          bash scripts/ci/compose-start-stack.sh
          # The SMTP sink only exists in the upstream-suite overlay, so it is
          # not part of the shared stack script.
          compose up -d mailpit
          bash scripts/ci/compose-wait-web.sh
      - name: Install upstream test dependencies
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          # The runtime image only installs production requirements. These are
          # Frappe's own `test`/`dev` extras needed by the suite (faker,
          # hypothesis, freezegun, responses, xmlrunner, pyngrok).
          compose exec -T web bash -lc '
            set -e
            cd /home/frappe/frappe-bench
            ./env/bin/pip install --quiet \
              "Faker~=18.10.1" \
              "hypothesis~=6.77.0" \
              "freezegun~=1.5.1" \
              "responses==0.23.1" \
              "unittest-xml-reporting~=3.2.0" \
              "pyngrok~=7.5.0"
          '
      - name: Configure test site for upstream tests
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          # Same shape as Frappe's own CI: HTTP tests need a reachable
          # host_name, mail tests need the compose-network SMTP sink, and CLI
          # tests need allow_tests/root_*. `bench new-site` stamps
          # developer_mode=1 into the site config, so it is turned off at both
          # levels here: the suite must test the production shape, not a dev
          # bench that rewrites doctype/workspace files on disk.
          compose exec -T web bash -lc '
            set -e
            cd /home/frappe/frappe-bench
            bench set-config -g developer_mode 0
            bench --site crm.localhost set-config developer_mode 0 --parse
            bench --site crm.localhost set-config allow_tests 1 --parse
            bench --site crm.localhost set-config server_script_enabled 1 --parse
            bench --site crm.localhost set-config host_name "http://crm.localhost:8000"
            bench --site crm.localhost set-config auto_email_id "test@example.com"
            bench --site crm.localhost set-config mail_server mailpit
            bench --site crm.localhost set-config mail_port 1025 --parse
            bench --site crm.localhost set-config mail_login "test@example.com"
            bench --site crm.localhost set-config mail_password admin
            # The command tests read this back for `bench new-site` and
            # `set-admin-password`, so it must be the real account password
            # (production shape: not "admin").
            bench --site crm.localhost set-config admin_password "Admin-Test-9f3K!"
            bench --site crm.localhost set-config root_login root
            bench --site crm.localhost set-config root_password admin
          '
      - name: Prepare app git metadata
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          # The deploy image strips repo metadata, but parts of the suite expect
          # a git working tree (translate/workspace tooling calls
          # git.Repo(...)). Give them a throwaway repo for the run only.
          compose exec -T web bash -lc '
            set -e
            cd /home/frappe/frappe-bench/apps/frappe
            git init -q
            git -c user.email=ci@example.com -c user.name=ci add -A
            git -c user.email=ci@example.com -c user.name=ci commit -qm ci-baseline
          '
      - name: Run upstream Frappe suite shard ${{ matrix.shard }}/2
        # Advisory: report failures as warnings instead of failing the job, so
        # known environment-parity failures do not paint the workflow red.
        run: |
          set -uo pipefail
          source scripts/ci/common.sh
          # common.sh turns on `set -e`, so the runner has to sit in an `if`
          # condition: a failing shard must annotate a warning, not abort.
          # CI=1 makes the parallel runner exit non-zero on failures. The log is
          # teed so a crashed shard (no execution summary) still shows its tail.
          if ! compose exec -T web bash -lc \
            "cd /home/frappe/frappe-bench && CI=1 bench --site crm.localhost run-parallel-tests --app frappe --build-number ${{ matrix.shard }} --total-builds 2" \
            2>&1 | tee /tmp/upstream-suite-${{ matrix.shard }}.log; then
            echo "::warning title=Upstream suite ${{ matrix.variant }} shard ${{ matrix.shard }}::suite reported failures (advisory, see log)"
            if ! grep -q 'Tests: [0-9]*, Failing' /tmp/upstream-suite-${{ matrix.shard }}.log; then
              echo "::warning title=Upstream suite ${{ matrix.variant }} shard ${{ matrix.shard }}::runner produced no summary (crashed mid-run)"
            fi
            echo "::group::tail of shard ${{ matrix.shard }} log"
            tail -n 150 /tmp/upstream-suite-${{ matrix.shard }}.log
            echo "::endgroup::"
          fi

  # STAGE 2d: the patch repository's own tests. These are Python unittest
  # checks (patch applicability, markers, workflow structure), not bench tests.
  patch-tests:
    name: 'Patch-layer tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout with Frappe submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Run patch-layer tests
        run: python -m unittest discover -s tests -p 'test_*.py' -t . -v

  # STAGE 2e: static analysis of the owned surface, independent of the image
  # build. Semgrep (OWASP Top 10 + CWE Top 25) still FAILS the job on
  # ERROR-severity findings; the Trivy source scan is report-only and runs even
  # when Semgrep fails, so neither result hides the other.
  static-analysis:
    name: 'Static analysis - Semgrep SAST + Trivy source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # Trivy source scan only; Semgrep keeps its own ERROR-severity gate.
      SECURITY_FAIL_ON_FINDINGS: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: false
      # The Trivy DB is ~250 MB and every scan job re-downloaded it. Restored
      # from cache, Trivy still checks freshness itself (>24 h re-downloads), so
      # a stale entry costs a metadata request, never a wrong scan.
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}-
      - name: Run Semgrep SAST
        run: bash scripts/ci/security-scan-sast.sh
      - name: Run Trivy filesystem + config scan
        if: always()
        run: bash scripts/ci/security-scan-source.sh
      - name: Upload Semgrep SARIF
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/semgrep.sarif
          category: semgrep
      - name: Upload Trivy filesystem SARIF
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-fs.sarif
          category: trivy-source-fs
      - name: Upload Trivy config SARIF
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-results/trivy-config.sarif
          category: trivy-source-config

  # STAGE 3a: push the EXACT tested images of ONE architecture as single-arch
  # manifests. Nothing is rebuilt: `docker tag` + `docker push` from the tested
  # archive. The arch-suffixed tags are permanent — the multi-arch index created
  # in STAGE 3b references these manifests by digest, and the GHCR cleanup
  # protects them via KEEP_TAG_PATTERN.
  publish-arch:
    name: 'Publish ${{ matrix.arch }} manifests'
    needs: [variant-matrix, upstream-tests, patch-tests, static-analysis]
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push_to_registry == true)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      frappe_version: ${{ steps.version.outputs.frappe_version }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Download tested ${{ matrix.arch }} images
        uses: actions/download-artifact@v8
        with:
          name: tested-images-${{ matrix.arch }}
          path: /tmp
      - name: Load tested images
        run: zstd -dc /tmp/tested-images.tar.zst | docker load
      - name: Login to the primary registry
        if: env.REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to GitHub Container Registry
        if: env.SECONDARY_REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SECONDARY_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both arch legs resolve the same pinned version; the merge job only needs
      # one of them, so the duplicate output is intentional.
      - name: Resolve pinned Frappe version
        id: version
        run: |
          source scripts/ci/common.sh
          echo "frappe_version=$(image_frappe_version frappe:latest)" >> "$GITHUB_OUTPUT"
      - name: Publish ${{ matrix.arch }} base/latest/latest-granian manifests
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          require_registry
          ARCH="${{ matrix.arch }}"
          FRAPPE_VERSION="$(image_frappe_version frappe:latest)"
          export FRAPPE_VERSION
          # Guard the arch tags against a wrong runner label: the tested images
          # must be the architecture this leg claims to publish.
          for image in frappe:base frappe:latest frappe-granian:latest; do
            have="$(docker image inspect -f '{{.Architecture}}' "$image")"
            case "$have" in x86_64) have=amd64 ;; aarch64) have=arm64 ;; esac
            if [ "$have" != "$ARCH" ]; then
              echo "::error::${image} is ${have}, refusing to publish it as ${ARCH}"
              exit 1
            fi
          done
          if [ "${PUBLISH_MOVING_TAGS}" = "1" ]; then
            publish_all frappe:base "frappe:base-${ARCH}"
            publish_all frappe:latest "frappe:latest-${ARCH}"
            publish_all frappe-granian:latest "frappe:latest-granian-${ARCH}"
          fi
          publish_all frappe:base "frappe:${FRAPPE_VERSION}-base-${ARCH}"
          publish_all frappe:latest "frappe:${FRAPPE_VERSION}-${ARCH}"
          publish_all frappe-granian:latest "frappe:${FRAPPE_VERSION}-granian-${ARCH}"

  # STAGE 3b: fold the two single-arch manifests into one multi-arch index per
  # published tag, in every configured registry. `imagetools create` only writes
  # the index that points at the already-pushed child manifests: the tested bytes
  # are never rebuilt or re-pushed, so each platform keeps its exact digest.
  publish:
    name: 'Merge multi-arch indexes and verify digests'
    needs: publish-arch
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push_to_registry == true)
    outputs:
      digests_json: ${{ steps.digests.outputs.digests_json }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      FRAPPE_VERSION: ${{ needs.publish-arch.outputs.frappe_version }}
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Login to the primary registry
        if: env.REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to GitHub Container Registry
        if: env.SECONDARY_REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SECONDARY_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and assert multi-arch indexes
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          require_registry
          : "${FRAPPE_VERSION:?FRAPPE_VERSION required (publish-arch output)}"

          tags=()
          if [ "${PUBLISH_MOVING_TAGS}" = "1" ]; then
            tags+=(base latest latest-granian)
          fi
          tags+=("${FRAPPE_VERSION}-base" "${FRAPPE_VERSION}" "${FRAPPE_VERSION}-granian")

          registries=()
          for reg in "$(primary_registry)" "$(secondary_registry)"; do
            [ -n "$reg" ] && registries+=("$reg")
          done
          [ "${#registries[@]}" -gt 0 ] || { echo "::error::no registry configured"; exit 1; }

          for reg in "${registries[@]}"; do
            for tag in "${tags[@]}"; do
              ref="${reg}/frappe:${tag}"
              echo "Merging ${ref} <- ${tag}-amd64 + ${tag}-arm64"
              docker buildx imagetools create -t "$ref" \
                "${reg}/frappe:${tag}-amd64" \
                "${reg}/frappe:${tag}-arm64"
            done
          done

          # Assert every published tag is a two-platform index whose children are
          # EXACTLY the arch manifests this run pushed (not a stale cache hit).
          for reg in "${registries[@]}"; do
            for tag in "${tags[@]}"; do
              ref="${reg}/frappe:${tag}"
              platforms="$(docker buildx imagetools inspect "$ref" \
                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
              echo "${ref}: ${platforms}"
              # An attestation manifest copied along with an arch image shows up
              # as unknown/unknown and means that arch tag was published as an
              # index, not a single manifest.
              case " ${platforms} " in
                *" unknown/unknown "*)
                  echo "::error::${ref} carries an unknown/unknown child; build with --provenance=false --sbom=false"; exit 1 ;;
              esac
              for want in linux/amd64 linux/arm64; do
                case " ${platforms} " in
                  *" ${want} "*) ;;
                  *) echo "::error::${ref} is not a multi-arch index with ${want}"; exit 1 ;;
                esac
              done
              for arch in amd64 arm64; do
                child="$(docker buildx imagetools inspect "$ref" \
                  --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")"
                child="${child#sha256:}"
                arch_digest="$(imagetools_digest "${reg}/frappe:${tag}-${arch}")"
                if [ "sha256:${child}" != "${arch_digest}" ]; then
                  echo "::error::${ref} ${arch} child (sha256:${child}) is not ${tag}-${arch} (${arch_digest})"
                  exit 1
                fi
              done
            done
          done
          echo "OK: multi-arch indexes cover ${#tags[@]} tags in ${#registries[@]} registries"
      - name: Verify published tags have distinct digests
        run: bash scripts/ci/publish-verify.sh
      - name: Resolve published GHCR digests
        id: digests
        run: bash scripts/ci/supply-chain-digests.sh

  # STAGE 4: bind supply-chain metadata to the EXACT published GHCR digests. One
  # matrix entry per variant: generate one SPDX SBOM PER PLATFORM, attach SLSA
  # build provenance + both SBOM attestations (pushed to the registry), then
  # keylessly sign the multi-arch index digest. Attestations and signatures live
  # in GHCR only.
  attest:
    name: 'Attest + sign ${{ matrix.variant }}'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        variant: [base, latest, latest-granian]
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Resolve digest and image reference
        id: subject
        env:
          DIGESTS_JSON: ${{ needs.publish.outputs.digests_json }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          digest="$(printf '%s' "$DIGESTS_JSON" | jq -r --arg v "$VARIANT" '.[$v]')"
          [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "no digest for ${VARIANT}"; exit 1; }
          image="$(printf '%s/%s/frappe' "$SECONDARY_REGISTRY_URL" "$SECONDARY_REGISTRY_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "digest=${digest}"
            echo "image=${image}"
            echo "ref=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SECONDARY_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        run: bash scripts/ci/install-cosign.sh
      - name: Install syft
        run: bash scripts/ci/install-syft.sh
      # The published tag is an index, so syft must be told which platform to
      # describe; one SBOM per platform keeps the attestation honest for arm64.
      - name: Generate SPDX SBOM (linux/amd64)
        env:
          IMAGE_REF: ${{ steps.subject.outputs.ref }}
        run: syft --platform linux/amd64 -o spdx-json=sbom-amd64.spdx.json "$IMAGE_REF"
      - name: Generate SPDX SBOM (linux/arm64)
        env:
          IMAGE_REF: ${{ steps.subject.outputs.ref }}
        run: syft --platform linux/arm64 -o spdx-json=sbom-arm64.spdx.json "$IMAGE_REF"
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.image }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true
      - name: Attest SPDX SBOM (linux/amd64)
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.image }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - name: Attest SPDX SBOM (linux/arm64)
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.image }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
      - name: Sign image digest (keyless)
        run: cosign sign --yes "${{ steps.subject.outputs.ref }}"

  # STAGE 5: hard-fail gate. Independently re-verify every variant's keyless
  # signature and both attestations against the pinned GitHub OIDC issuer and
  # this repository's build-images.yml workflow identity.
  verify:
    name: 'Verify signatures and attestations'
    needs: [publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.SECONDARY_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        run: bash scripts/ci/install-cosign.sh
      - name: Verify signatures and attestations
        env:
          DIGESTS_JSON: ${{ needs.publish.outputs.digests_json }}
        run: bash scripts/ci/verify-supply-chain.sh
