# Composition experiment (experiments/frappe-oci-composition/).
# Builds the composed runtime + per-app payload artifact images via
# docker compose, boots the full stack, and smoke-tests it. Runs when:
#   1. the composition dir (or this workflow) changes on main, or
#   2. a base image version is published to the ghcr `frappe` package
#      (base / latest / latest-granian) — the composition always rebuilds
#      on top of fresh bases. Own pushes go to the `fayolex-composed`
#      package, which is filtered out, so no trigger loop.
name: Composition Docker Compose

on:
  push:
    branches: [main]
    paths:
      - 'experiments/frappe-oci-composition/docker-compose/**'
      - '.github/workflows/composition.yml'
  workflow_dispatch:
  registry_package:
    types: [published]

permissions:
  contents: read
  packages: write

# Push and registry_package can fire for the same logical change; collapse
# duplicates so only the newest run builds.
concurrency:
  group: composition-${{ github.repository }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/fayolex-composed
  CONTEXT: experiments/frappe-oci-composition/docker-compose
  # Keep the compose project private to this run so overlapping runs on a
  # shared host daemon can't tear down each other's containers.
  COMPOSE_PROJECT_NAME: composition-ci-${{ github.run_id }}

jobs:
  build:
    name: Compose build, up & smoke test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'registry_package' ||
      github.event.package.name == 'frappe'
    defaults:
      run:
        working-directory: experiments/frappe-oci-composition/docker-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick free HTTP port
        run: |
          echo "HTTP_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')" >> "$GITHUB_ENV"

      - name: Compose build (runtime + app artifacts)
        run: |
          docker compose --profile build build

      - name: Compose up
        run: |
          docker compose up -d mariadb redis
          echo "Running init (site creation, app install, assets)..."
          docker compose run --rm init
          docker compose up -d web worker worker-long worker-short schedule socketio nginx

      - name: Test live API ping via nginx
        run: |
          SUCCESS=0
          for i in $(seq 1 60); do
            STATUS=$(docker compose exec -T nginx curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:8080/api/method/ping" || true)
            echo "Waiting for live API... (status: $STATUS, attempt $i/60)"
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/method/ping returned HTTP 200 through nginx"
              SUCCESS=1
              break
            fi
            if [ $((i % 10)) -eq 1 ]; then
              echo "--- Diagnostics (attempt $i) ---"
              docker compose ps
            fi
            sleep 5
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Live API ping failed. Logs:"
            docker compose logs web --no-color || true
            docker compose logs init --no-color || true
            docker compose logs nginx --no-color || true
            exit 1
          fi

      - name: Test bench + installed apps inside running stack
        run: |
          docker compose exec -T web bash -c '
            set -e
            cd /home/frappe/frappe-bench
            bench --site "${SITE_NAME:-crm.localhost}" list-apps
            env/bin/python -c "import frappe; print(\"frappe\", frappe.__version__)"
          '

      - name: Enforce hashed asset contract via nginx (no assets.json)
        run: |
          # Bundle filenames are hashed (esbuild entryNames "[dir]/[name].[hash]",
          # see patches/0007-drop-assets-json-manifest.patch) but no assets.json
          # manifest ships: python derives the name -> hashed-path map from the
          # dist trees at runtime. That keeps the old production failure mode -
          # a manifest naming a content hash nginx never had - impossible, while
          # URLs keep the content hash. What must hold: no manifest exists, every
          # logical bundle name resolves to exactly one hashed file on disk, and
          # that hashed file serves HTTP 2xx via nginx. Plus the standalone static
          # asset contract.
          docker compose exec -T nginx python3 - <<'EOS'
          import glob, os, subprocess, sys
          sites = "/home/frappe/frappe-bench/sites"
          manifest = os.path.join(sites, "assets", "assets.json")
          if os.path.lexists(manifest):
              print(f"❌ {manifest} still present - the manifest must not ship")
              sys.exit(1)
          print("✅ no assets.json manifest in the image or on the sites volume")

          failed = []

          def check(label, url_path):
              r = subprocess.run(
                  ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                   f"http://127.0.0.1:8080{url_path}"],
                  capture_output=True, text=True)
              code = r.stdout or "000"
              if code[:1] != "2":
                  print(f"❌ {label} -> {url_path} returned HTTP {code}")
                  failed.append((label, url_path, code))
              else:
                  print(f"✅ {label} -> {url_path} (HTTP {code})")

          def resolve(app, kind, name):
              # esbuild emits "<name>.<hash>.<ext>"; .map files are excluded so
              # exactly one bundle file must match, exactly like the runtime map.
              # NOTE: glob.glob does NOT expand {js,css} braces — the ext is
              # derived from the kind instead.
              ext = "js" if kind == "js" else "css"
              pattern = os.path.join(sites, "assets", app, "dist", kind,
                                     f"{name}.*.{ext}")
              matches = [p for p in glob.glob(pattern) if not p.endswith(".map")]
              return matches

          # Every composition app's known bundles are asserted: the runtime map is
          # derived from the dist trees, so a name can only 404 if the app
          # artifact actually failed to ship that bundle.
          bundle_checks = [
              ("frappe", "js", "desk.bundle"),
              ("frappe", "css", "desk.bundle"),
              ("frappe", "css", "login.bundle"),
              ("frappe", "css", "print.bundle"),
              ("frappe", "js", "web.bundle"),
              ("frappe", "css", "website.bundle"),
              ("frappe", "js", "form.bundle"),
              ("frappe", "js", "controls.bundle"),
              ("frappe", "js", "list.bundle"),
              ("frappe", "js", "libs.bundle"),
              ("erpnext", "js", "erpnext.bundle"),
              ("erpnext", "css", "erpnext.bundle"),
              ("erpnext", "js", "erpnext-web.bundle"),
              ("erpnext", "css", "erpnext-web.bundle"),
              ("erpnext", "css", "erpnext_email.bundle"),
              ("erpnext", "js", "bank-reconciliation-tool.bundle"),
              ("erpnext", "js", "point-of-sale.bundle"),
              ("hrms", "js", "hrms.bundle"),
              ("hrms", "css", "hrms.bundle"),
              ("hrms", "js", "hierarchy-chart.bundle"),
              ("hrms", "js", "performance.bundle"),
              ("hrms", "js", "interview.bundle"),
              ("eps", "js", "eps.bundle"),
              ("eps", "css", "eps.bundle"),
              # RTL css bundles are keyed rtl_<name> and served from css-rtl/;
              # frappe emits these links for rtl locales, so they must serve too.
              ("frappe", "css-rtl", "desk.bundle"),
              ("frappe", "css-rtl", "login.bundle"),
              ("frappe", "css-rtl", "website.bundle"),
              ("erpnext", "css-rtl", "erpnext.bundle"),
              ("hrms", "css-rtl", "hrms.bundle"),
              ("eps", "css-rtl", "eps.bundle"),
          ]
          print(f"Enforcing hashed bundle contract ({len(bundle_checks)} checks)...")
          for app, kind, name in bundle_checks:
              matches = resolve(app, kind, name)
              if len(matches) != 1:
                  print(f"❌ {app}:{name} ({kind}) matched {len(matches)} files on disk, expected 1")
                  failed.append((app, name, f"{len(matches)} matches"))
                  continue
              check(f"{app}:bundle", "/" + os.path.relpath(matches[0], sites))

          # Unhashed logical paths must NOT be served: the hash segment is the
          # content contract, so an old cached URL without it should 404.
          unhashed = "/assets/frappe/dist/js/desk.bundle.js"
          r = subprocess.run(
              ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
               f"http://127.0.0.1:8080{unhashed}"], capture_output=True, text=True)
          code = r.stdout or "000"
          if code == "200":
              print(f"❌ unhashed {unhashed} served HTTP 200 - esbuild must emit hashed names")
              failed.append(("unhashed", unhashed, code))
          else:
              print(f"✅ unhashed {unhashed} not served (HTTP {code})")

          # Enforce standalone image format contract:
          # Verify known static public assets across all apps return HTTP 2xx via nginx
          static_checks = [
              ("frappe", "/assets/frappe/images/frappe-framework-logo.svg"),
              ("erpnext", "/assets/erpnext/icons/desktop_icons/solid/subscription.svg"),
              ("erpnext", "/assets/erpnext/images/erpnext-logo.svg"),
              ("hrms", "/assets/hrms/frontend/manifest.webmanifest"),
              ("hrms", "/assets/hrms/frontend/index.html"),
              ("eps", "/assets/eps/images/eps.svg"),
          ]
          print(f"Enforcing standalone image static asset contract ({len(static_checks)} checks)...")
          for app, static_url in static_checks:
              check(f"{app}:static", static_url)

          if failed:
              print("❌ Asset contract validation failed:")
              for name, p, code in failed:
                  print(f"  {name} ({p}) HTTP {code}")
              sys.exit(1)
          print("✅ No manifest, and all hashed bundles + static public assets serve HTTP 2xx through nginx")
          EOS

      - name: Cleanup compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
