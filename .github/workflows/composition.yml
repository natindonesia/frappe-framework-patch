# Composition experiment (experiments/frappe-oci-composition/).
# Builds the composed runtime + per-app payload artifact images via
# docker compose, boots the full stack, and smoke-tests it. Runs when:
#   1. the composition dir (or this workflow) changes on main, or
#   2. a base image version is published to the ghcr `frappe` package
#      (base / latest / latest-granian) — the composition always rebuilds
#      on top of fresh bases. Own pushes go to the `fayolex-composed`
#      package, which is filtered out, so no trigger loop.
name: Composition Docker Compose

on:
  push:
    branches: [main]
    paths:
      - 'experiments/frappe-oci-composition/docker-compose/**'
      - '.github/workflows/composition.yml'
  workflow_dispatch:
  registry_package:
    types: [published]

permissions:
  contents: read
  packages: write

# Push and registry_package can fire for the same logical change; collapse
# duplicates so only the newest run builds.
concurrency:
  group: composition-${{ github.repository }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/fayolex-composed
  CONTEXT: experiments/frappe-oci-composition/docker-compose
  # Keep the compose project private to this run so overlapping runs on a
  # shared host daemon can't tear down each other's containers.
  COMPOSE_PROJECT_NAME: composition-ci-${{ github.run_id }}

jobs:
  build:
    name: Compose build, up & smoke test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'registry_package' ||
      github.event.package.name == 'frappe'
    defaults:
      run:
        working-directory: experiments/frappe-oci-composition/docker-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick free HTTP port
        run: |
          echo "HTTP_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')" >> "$GITHUB_ENV"

      - name: Compose build (runtime + app artifacts)
        run: |
          docker compose --profile build build

      - name: Compose up
        run: |
          docker compose up -d mariadb redis
          echo "Running init (site creation, app install, assets)..."
          docker compose run --rm init
          docker compose up -d web worker worker-long worker-short schedule socketio nginx

      - name: Test live API ping via nginx
        run: |
          SUCCESS=0
          for i in $(seq 1 60); do
            STATUS=$(docker compose exec -T nginx curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:8080/api/method/ping" || true)
            echo "Waiting for live API... (status: $STATUS, attempt $i/60)"
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/method/ping returned HTTP 200 through nginx"
              SUCCESS=1
              break
            fi
            if [ $((i % 10)) -eq 1 ]; then
              echo "--- Diagnostics (attempt $i) ---"
              docker compose ps
            fi
            sleep 5
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Live API ping failed. Logs:"
            docker compose logs web --no-color || true
            docker compose logs init --no-color || true
            docker compose logs nginx --no-color || true
            exit 1
          fi

      - name: Test bench + installed apps inside running stack
        run: |
          docker compose exec -T web bash -c '
            set -e
            cd /home/frappe/frappe-bench
            bench --site "${SITE_NAME:-crm.localhost}" list-apps
            env/bin/python -c "import frappe; print(\"frappe\", frappe.__version__)"
          '

      - name: Enforce unhashed asset contract via nginx (no assets.json)
        run: |
          # Bundle filenames are unhashed (esbuild entryNames "[dir]/[name]", see
          # patches/0007-drop-assets-json-manifest.patch), so the old failure mode -
          # manifest pointing at a content hash that 404s - cannot happen any more.
          # What must hold instead: no manifest exists, and the logical path frappe
          # emits is the path nginx serves. Plus the standalone static asset contract.
          docker compose exec -T nginx python3 - <<'EOS'
          import os, subprocess, sys
          sites = "/home/frappe/frappe-bench/sites"
          manifest = os.path.join(sites, "assets", "assets.json")
          if os.path.lexists(manifest):
              print(f"❌ {manifest} still present - the manifest must not ship")
              sys.exit(1)
          print("✅ no assets.json manifest in the image or on the sites volume")

          failed = []

          def check(label, url_path):
              r = subprocess.run(
                  ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                   f"http://127.0.0.1:8080{url_path}"],
                  capture_output=True, text=True)
              code = r.stdout or "000"
              if code[:1] != "2":
                  print(f"❌ {label} -> {url_path} returned HTTP {code}")
                  failed.append((label, url_path, code))
              else:
                  print(f"✅ {label} -> {url_path} (HTTP {code})")

            # Frappe links these by their logical path; with unhashed bundle
            # filenames the logical path must be exactly the served path.
            # Every composition app's known bundles are asserted: the map is
            # derived from the dist trees, so a name can only 404 if the app
            # artifact actually failed to ship that bundle.
            bundle_checks = [
            	("frappe", "/assets/frappe/dist/js/desk.bundle.js"),
            	("frappe", "/assets/frappe/dist/css/desk.bundle.css"),
            	("frappe", "/assets/frappe/dist/css/login.bundle.css"),
            	("frappe", "/assets/frappe/dist/css/print.bundle.css"),
            	("frappe", "/assets/frappe/dist/js/web.bundle.js"),
            	("frappe", "/assets/frappe/dist/css/website.bundle.css"),
            	("frappe", "/assets/frappe/dist/js/form.bundle.js"),
            	("frappe", "/assets/frappe/dist/js/controls.bundle.js"),
            	("frappe", "/assets/frappe/dist/js/list.bundle.js"),
            	("frappe", "/assets/frappe/dist/js/libs.bundle.js"),
            	("frappe", "/assets/frappe/css/frappe.css"),
            	("frappe", "/assets/frappe/node_modules/ace-builds/src-min-noconflict/ace.js"),
            	("erpnext", "/assets/erpnext/dist/js/erpnext.bundle.js"),
            	("erpnext", "/assets/erpnext/dist/css/erpnext.bundle.css"),
            	("erpnext", "/assets/erpnext/dist/js/erpnext-web.bundle.js"),
            	("erpnext", "/assets/erpnext/dist/css/erpnext-web.bundle.css"),
            	("erpnext", "/assets/erpnext/dist/css/erpnext_email.bundle.css"),
            	("erpnext", "/assets/erpnext/dist/js/bank-reconciliation-tool.bundle.js"),
            	("erpnext", "/assets/erpnext/dist/js/point-of-sale.bundle.js"),
            	("hrms", "/assets/hrms/dist/js/hrms.bundle.js"),
            	("hrms", "/assets/hrms/dist/css/hrms.bundle.css"),
            	("hrms", "/assets/hrms/dist/js/hierarchy-chart.bundle.js"),
            	("hrms", "/assets/hrms/dist/js/performance.bundle.js"),
            	("hrms", "/assets/hrms/dist/js/interview.bundle.js"),
            	("eps", "/assets/eps/dist/js/eps.bundle.js"),
            	("eps", "/assets/eps/dist/css/eps.bundle.css"),
            	# RTL css bundles are keyed rtl_<name> and served from css-rtl/;
            	# frappe emits these links for rtl locales, so they must serve too.
            	("frappe:rtl", "/assets/frappe/dist/css-rtl/desk.bundle.css"),
            	("frappe:rtl", "/assets/frappe/dist/css-rtl/login.bundle.css"),
            	("frappe:rtl", "/assets/frappe/dist/css-rtl/website.bundle.css"),
            	("erpnext:rtl", "/assets/erpnext/dist/css-rtl/erpnext.bundle.css"),
            	("hrms:rtl", "/assets/hrms/dist/css-rtl/hrms.bundle.css"),
            	("eps:rtl", "/assets/eps/dist/css-rtl/eps.bundle.css"),
            ]
          print(f"Enforcing unhashed bundle contract ({len(bundle_checks)} checks)...")
          for app, url_path in bundle_checks:
              check(app, url_path)

          # Enforce standalone image format contract:
          # Verify known static public assets across all apps return HTTP 2xx via nginx
          static_checks = [
              ("frappe", "/assets/frappe/images/frappe-framework-logo.svg"),
              ("erpnext", "/assets/erpnext/icons/desktop_icons/solid/subscription.svg"),
              ("erpnext", "/assets/erpnext/images/erpnext-logo.svg"),
              ("hrms", "/assets/hrms/frontend/manifest.webmanifest"),
              ("hrms", "/assets/hrms/frontend/index.html"),
              ("eps", "/assets/eps/images/eps.svg"),
          ]
          print(f"Enforcing standalone image static asset contract ({len(static_checks)} checks)...")
          for app, static_url in static_checks:
              check(f"{app}:static", static_url)

          if failed:
              print("❌ Asset contract validation failed:")
              for name, p, code in failed:
                  print(f"  {name} ({p}) HTTP {code}")
              sys.exit(1)
          print("✅ No manifest, and all unhashed bundles + static public assets serve HTTP 2xx through nginx")
          EOS

      - name: Cleanup compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
