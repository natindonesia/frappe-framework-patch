# =============================================================================
# Build Granian (alternative runtime) Docker Image.
#
# OPTIONAL alternative runtime, migrated from the org's build-granian workflow
# and adapted to this patch repository's (simpler) model:
#
#   • Builds the canonical patched-Frappe base image from the root Dockerfile
#     and loads it locally as `frappe:latest` (this repo has no bench/compose
#     stack, so the base image is produced here too -- unlike the upstream
#     workflow that reused a bench host's cached image).
#   • Builds the Granian variant from Dockerfile.granian (thin layer on
#     `frappe:latest`) -> `frappe-granian:latest`.
#   • Verifies the Granian server is installed AND actually serves a WSGI app
#     (the runtime swap confined to the server process; a full Frappe site
#     needs a DB, so the functional check is the server + the WSGI contract).
#   • On push to main: publishes the Granian variant to the same DigitalOcean
#     registry with the same immutable-tag convention <upstream>-<patch>.
#
# The default (wheel + OTel gunicorn-compatible) pipeline in build-docker.yml
# / build-push.yml is untouched.
# =============================================================================
name: Build Granian Docker Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push to DigitalOcean Container Registry
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  REGISTRY_URL: registry.digitalocean.com
  REGISTRY_NAMESPACE: natindonesia
  IMAGE_NAME: frappe-granian

permissions:
  contents: read

jobs:
  granian-build:
    name: Build and test Granian variant image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate patch application
        run: |
          bash -n scripts/*.sh tests/run_tests.sh
          bash scripts/verify-patches.sh
          bash tests/run_tests.sh --no-otel

      - name: Compute image metadata
        run: |
          upstream_sha="$(git -C frappe rev-parse --short=12 HEAD)"
          patch_sha="$(git rev-parse --short=12 HEAD)"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "PATCH_REPO_SHA=$patch_sha" >> "$GITHUB_ENV"
          echo "IMAGE=\${REGISTRY_URL}/\${REGISTRY_NAMESPACE}/\${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMMUTABLE_TAG=\${upstream_sha}-\${patch_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical base image (frappe:latest, local, no push)
        run: |
          docker buildx build \
            --load \
            --build-arg UPSTREAM_SHA="$UPSTREAM_SHA" \
            --build-arg PATCH_REPO_SHA="$PATCH_REPO_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t frappe:latest \
            .

      - name: Build Granian variant image (frappe-granian:latest)
        run: |
          docker build \
            --build-arg UPSTREAM_SHA="$UPSTREAM_SHA" \
            --build-arg PATCH_REPO_SHA="$PATCH_REPO_SHA" \
            -t frappe-granian:latest \
            -f Dockerfile.granian \
            .

      - name: Verify Granian installed in image
        run: |
          docker run --rm frappe-granian:latest granian --version

      - name: Verify Granian serves a WSGI app end-to-end
        run: |
          docker run --rm frappe-granian:latest bash -c '
            set -euo pipefail
            cat > /tmp/hwapp.py <<PY
            def application(environ, start_response):
                start_response("200 OK", [("Content-Type", "text/plain")])
                return [b"granian-ok"]
            PY
            cd /tmp
            granian --interface wsgi --host 127.0.0.1 --port 8355 --workers 1 \
              hwapp:application & srvc=$!
            ok=""
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8355/ >/tmp/body.txt 2>/dev/null; then ok=1; break; fi
              sleep 1
            done
            kill "$srvc" 2>/dev/null || true
            wait "$srvc" 2>/dev/null || true
            [ -n "$ok" ] || { echo "::error::granian did not serve WSGI app"; exit 1; }
            grep -q "granian-ok" /tmp/body.txt || { echo "::error::unexpected body: $(cat /tmp/body.txt)"; exit 1; }
            echo "granian served WSGI app successfully: $(cat /tmp/body.txt)"
          '

  push-registry:
    name: Push Granian variant image
    needs: granian-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute image metadata
        run: |
          upstream_sha="$(git -C frappe rev-parse --short=12 HEAD)"
          patch_sha="$(git rev-parse --short=12 HEAD)"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "PATCH_REPO_SHA=$patch_sha" >> "$GITHUB_ENV"
          echo "IMAGE=\${REGISTRY_URL}/\${REGISTRY_NAMESPACE}/\${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMMUTABLE_TAG=\${upstream_sha}-\${patch_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base and Granian variant images
        run: |
          docker buildx build \
            --load \
            --build-arg UPSTREAM_SHA="$UPSTREAM_SHA" \
            --build-arg PATCH_REPO_SHA="$PATCH_REPO_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t frappe:latest \
            .
          docker build \
            --build-arg UPSTREAM_SHA="$UPSTREAM_SHA" \
            --build-arg PATCH_REPO_SHA="$PATCH_REPO_SHA" \
            -t "$IMAGE:$IMMUTABLE_TAG" -t "$IMAGE:latest" \
            -f Dockerfile.granian \
            .

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Push immutable and latest tags
        run: |
          docker push "$IMAGE:$IMMUTABLE_TAG"
          docker push "$IMAGE:latest"

      - name: Summarize published image
        run: |
          echo "Published $IMAGE:$IMMUTABLE_TAG and $IMAGE:latest (Granian variant)" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream Frappe: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Patch repository: $PATCH_REPO_SHA" >> "$GITHUB_STEP_SUMMARY"