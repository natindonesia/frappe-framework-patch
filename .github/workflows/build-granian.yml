# =============================================================================
# Build Granian (alternative) Docker Image — NO PUSH
#
# OPTIONAL alternative runtime build, kept OUT of build-docker.yml so the
# production gunicorn pipeline (test-build -> compose-integration ->
# push-registry) is untouched. This workflow:
#
#   • expects the canonical image already present locally as `frappe:latest`
#     (it does NOT build the base image, nor push anything)
#   • builds the Granian variant from Dockerfile.granian -> `frappe-granian:latest`
#   • boots the FULL compose stack with the `web` service serving via Granian
#     instead of gunicorn (resources/compose.granian-ci.yml override)
#   • asserts the serving process is granian (not gunicorn) and /api/method/ping
#     returns pong through nginx
#
# NEVER pushes to a registry. Run manually (workflow_dispatch) or on a tag.
# Requires a runner that has already run build-docker.yml's test-build job (so
# frappe:latest is cached locally) — set REUSE_BASE_IMAGE to false to build the
# base image here instead.
#
# Migrated from frappe/.github/workflows/build-granian.yml to this patch
# repository. The base image is built from the Dockerfile, which applies
# ./patches to ./frappe before bench init.
# =============================================================================

name: Build Granian Docker Image (no push)

on:
  workflow_dispatch:
    inputs:
      reuse_base_image:
        description: 'Reuse local frappe:latest (set false to build the base image here)'
        required: false
        default: true
        type: boolean
  push:
  pull_request:

env:
  DOCKER_BUILDKIT: 1

jobs:
  granian-build:
    name: Build & test Granian runtime (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: granian-build-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # frappe:latest is the canonical image --load'ed by build-docker.yml's
      # test-build job on the same runner. Reuse it if present so this workflow
      # does NOT rebuild the base AND does not push. If missing (e.g. a
      # dedicated runner), build the base image from the root Dockerfile with
      # the same layer cache command.
      - name: Ensure canonical base image (frappe:latest)
        run: |
          if [ "${{ inputs.reuse_base_image }}" = "false" ] || ! docker image inspect frappe:latest >/dev/null 2>&1; then
            echo "building canonical frappe:latest (local, no push)"
            docker buildx build \
              --load \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              -t frappe:latest \
              .
          else
            echo "reusing cached frappe:latest (no rebuild, no push)"
          fi

      - name: Build Granian variant image (frappe-granian:latest, no push)
        run: |
          # Plain `docker build` (default builder, local daemon) so `FROM
          # frappe:latest` in Dockerfile.granian resolves to the image that the
          # ensure-base step just --load'ed into THIS daemon. `docker buildx`
          # uses an isolated docker-container builder that would instead try to
          # pull frappe:latest from docker.io (which does not exist / not
          # authorized). Variant is a thin layer on the base, so no cache flags.
          docker build \
            -t frappe-granian:latest \
            -f Dockerfile.granian \
            .

      - name: Verify Granian installed in image
        run: |
          docker run --rm frappe-granian:latest bash -c "
            mkdir -p /home/frappe/logs &&
            ./env/bin/granian --version &&
            ./env/bin/python -c 'import frappe; from frappe.otel_wsgi import application; print(f\"Frappe {frappe.__version__} granian entrypoint loads\")'
          "

      - name: Cleanup lingering containers
        run: docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml down --remove-orphans || true

      - name: Start DB, Redis & OTEL Collector
        run: |
          HTTP_PORT=18086 docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml up -d mariadb redis otel-collector

      - name: Run init container explicitly (live logs)
        run: |
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 HTTP_PORT=18086 \
            docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml run --rm init

      - name: Start remaining stack (granian web + OTEL on)
        run: |
          # Trace all services via collector (scheme-less host:port for the nginx
          # leg — ngx_otel_module rejects http:// prefix), same env plumbing as
          # the gunicorn compose-integration job (build-docker.yml).
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 NGINX_OTEL_ENDPOINT=otel-collector:4317 HTTP_PORT=18086 \
            docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml up -d web socketio worker schedule worker-long worker-short nginx

      - name: Wait for web readiness
        run: |
          # Granian spawns one process per worker, each cold-importing the
          # whole Frappe app (no --preload). First boot routinely takes 60-90s;
          # give it 120 iterations x 2s = 240s of margin.
          ok=""
          for i in $(seq 1 120); do
            code=$(docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml exec -T nginx curl -s -o /dev/null -w "%{http_code}" -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping || true)
            echo "readiness attempt $i: HTTP $code"
            [ "$code" = "200" ] && ok=1 && break
            sleep 2
          done
          [ -n "$ok" ] || { docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml logs web nginx; exit 1; }
          echo "web ready through granian (HTTP 200)"

      - name: Assert Granian (not gunicorn) is the serving process
        run: |
          # The web service must be running the granian binary. If a future
          # change backslides the web command to gunicorn, this fails loudly.
          # Read /proc/1/cmdline in the web container -- the base frappe image
          # ships no `ps` binary, so `ps ww` fails with command not found.
          web_id=$(docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml ps -q web)
          cmd=$(docker exec "$web_id" sh -c 'tr "\000" " " < /proc/1/cmdline')
          echo "web PID1 cmdline: $cmd"
          if echo "$cmd" | grep -qE 'granian.*otel_wsgi' && ! echo "$cmd" | grep -q 'gunicorn'; then
            echo "web service is serving via granian"
          else
            echo "::error::web service is not running granian (see PID1 cmdline above)"
            exit 1
          fi

      - name: Assert API through granian returns pong
        run: |
          body=$(docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml exec -T nginx curl -s -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping)
          echo "ping response: $body"
          echo "$body" | grep -q '"message":"pong"' || { echo "::error::expected pong, got: $body"; exit 1; }

      - name: Assert OTEL spans through granian (both legs + shared trace)
        run: |
          # Trigger a request through the granian-served app (HTTP 200 pong).
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml exec -T nginx curl -s -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping
          # Collector batches traces (send-batch-timeout 5s), so on a cold
          # start its debug-exporter log is empty — or holds only nginx error
          # spans from the readiness loop (502s before web was up) — until a full
          # batch flushes. Poll until ONE trace id carries BOTH the nginx and the
          # app leg;; otherwise the assert races the first flush / a stray 502.
          for i in $(seq 1 20); do
            trace_map=$(docker compose -p ci-granian logs otel-collector | awk '
              /service\.name: Str\(/ {
                s=$0; sub(/.*service\.name: Str\(/,"",s); sub(/\).*/,"",s); svc=s
              }
              /Trace ID[[:space:]]*:/ { gsub(/.*: /,""); print $1, svc }
            ' | sort -u)
            trace=$(echo "$trace_map" | awk '
              { t=$1; s=$2; svc[t","s]=1; have[t]=1 }
              END { for (t in have) if (svc[t",frappe-nginx"] && svc[t",frappe-app"]) { print t; exit } }
            ')
            [ -n "$trace" ] && break
            sleep 2
          done
          if [ -n "$trace" ]; then
            echo "trace continuity OK: $trace (frappe-nginx + frappe-app through granian)"
            exit 0
          fi
          echo "::error::no trace carried BOTH frappe-nginx + frappe-app through granian after 40s of polling"
          echo "--- collected (trace, service) pairs ---"
          if [ -n "$trace_map" ]; then
            echo "$trace_map"
            [ -n "$(echo "$trace_map" | grep ' frappe-nginx$')" ] || echo "MISSING: zero frappe-nginx (nginx) traces reached the collector"
            [ -n "$(echo "$trace_map" | grep ' frappe-app$')" ]   || echo "MISSING: zero frappe-app (granian) traces reached the collector"
          else
            echo "(collector log produced no (trace, service) pairs — collector empty/never flushed)"
          fi
          echo "--- otel-collector log: line count + tail 60 ---"
          docker compose -p ci-granian logs otel-collector | wc -l
          docker compose -p ci-granian logs --tail 60 otel-collector || true
          echo "--- nginx endpoint env ---"
          docker compose -p ci-granian exec -T nginx sh -c 'echo nginx NGINX_OTEL_ENDPOINT=[$NGINX_OTEL_ENDPOINT] OTLP=[$OTEL_EXPORTER_OTLP_ENDPOINT]' || true
          echo "--- web/app endpoint env ---"
          docker compose -p ci-granian exec -T web sh -c 'echo web OTLP=[$OTEL_EXPORTER_OTLP_ENDPOINT] OTEL_SERVICE_NAME=[$OTEL_SERVICE_NAME]' || true
          exit 1

      # Full-DB CRUD through the granian-served REST API, mirroring the
      # create/read/list/update/delete loadtest.js/perf.sh drive on
      # /api/resource/ToDo. This is the real functional check: routing (ping)
      # and process identity (granian) are proven above, but neither exercises
      # the DB read/write path the way this does. cookie land in /tmp of the nginx
      # container (its only mount, sites-data, is :ro; /tmp writes and the
      # container vanish at teardown). OPTS avoids cherry-picking quote kinds.
      - name: Assert CRUD through granian (perf.sh ToDo shape)
        run: |
          set -euo pipefail
          CMD="docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml exec -T nginx curl -sS --max-time 60"
          HDR="Host: crm.localhost"
          CK=/tmp/crud_cookie.$$
          LF=/tmp/crud_log.$$
          trap 'rm -f "$CK" "$LF"' EXIT
          pass=0; fail=0
          ok()  { pass=$((pass+1)); echo "  PASS: $*"; }
          bad() { fail=$((fail+1)); echo "  FAIL: $*"; }
          status() {
            echo "------"
            echo "\$ $*"
            "$@" -w $'\nHTTP_STATUS:%{http_code}' 2>&1 | tee "$LF" || true
            HTTP_STATUS="$(grep -oE 'HTTP_STATUS:[0-9]+$' "$LF" | tail -1 | cut -d: -f2)"
            HTTP_BODY="$(sed '$d' "$LF")"
          }
          echo "== CRUD smoke  (granian + nginx + ToDo) =="
          # login
          status $CMD -X POST http://127.0.0.1:8080/api/method/login -H "$HDR" -H "Content-Type: application/x-www-form-urlencoded" -c "$CK" -d "usr=Administrator&pwd=${ADMIN_PASSWORD:-admin}"
          if [ "$HTTP_STATUS" = 200 ] && echo "$HTTP_BODY" | grep -q '\"Logged In\"'; then ok "login Administrator"; else bad "login HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; fi
          # create
          DESC="crud-$(date +%s)"
          status $CMD -b "$CK" -H "$HDR" -H "Content-Type: application/json" -d "{\"data\":{\"doctype\":\"ToDo\",\"description\":\"$DESC\",\"status\":\"Open\"}}" http://127.0.0.1:8080/api/resource/ToDo
          NAME="$(printf '%s' \"$HTTP_BODY\" | grep -oE '\"name\":\"[^\"]+\"' | head -1 | sed -E 's/.*\"name\":\"([^\"]+)\".*/\1/')"
          case "$HTTP_STATUS" in
            200|201) [ -n "$NAME" ] && ok "create ToDo -> $NAME" || { bad "create no name: $HTTP_BODY"; exit 1; } ;;
            *) bad "create HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; ;;
          esac
          # read
          status $CMD -b "$CK" -H "$HDR" "http://127.0.0.1:8080/api/resource/ToDo/$NAME"
          case "$HTTP_STATUS" in
            200) printf '%s' "$HTTP_BODY" | grep -q "$DESC" && ok "read item matches" || { bad "read body missing desc: $HTTP_BODY"; exit 1; } ;;
            *) bad "read HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; ;;
          esac
          # list
          status $CMD -b "$CK" -H "$HDR" "http://127.0.0.1:8080/api/resource/ToDo?limit_page_length=20"
          case "$HTTP_STATUS" in
            200) printf '%s' "$HTTP_BODY" | grep -q "$NAME" && ok "list contains item" || { bad "list missing item: $HTTP_BODY"; exit 1; } ;;
            *) bad "list HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; ;;
          esac
          # update
          status $CMD -X PUT -b "$CK" -H "$HDR" -H "Content-Type: application/json" -d '{\"data\":{\"status\":\"Closed\"}}' "http://127.0.0.1:8080/api/resource/ToDo/$NAME"
          [ "$HTTP_STATUS" = 200 ] && ok "update item (status -> Closed)" || { bad "update HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; }
          # delete
          status $CMD -X DELETE -b "$CK" -H "$HDR" "http://127.0.0.1:8080/api/resource/ToDo/$NAME"
          case "$HTTP_STATUS" in
            200|202) ok "delete item (cleanup)" ;;
            *) bad "delete HTTP $HTTP_STATUS: $HTTP_BODY"; exit 1; ;;
          esac
          echo
          echo "CRUD result: $pass passed, $fail failed"
          [ "$fail" -eq 0 ] || { echo "CRUD FAILED"; exit 1; }

      # MUST run BEFORE teardown: teardown removes all containers, so any dump
      # after it captures nothing. On failure, capture live container logs.
      - name: Diagnostic dump on failure
        if: failure()
        run: |
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml ps -a || true
          echo "--- otel-collector logs ---"
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml logs otel-collector || true
          echo "--- web logs ---"
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml logs web || true
          echo "--- nginx logs ---"
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml logs nginx || true

      - name: Teardown
        if: always()
        run: |
          docker compose -p ci-granian -f docker-compose.yml -f resources/compose.ci.yml -f resources/compose.granian-ci.yml down --remove-orphans
          # NEVER pass -v: ci-granian volumes persist so later runs exercise the idempotent init path