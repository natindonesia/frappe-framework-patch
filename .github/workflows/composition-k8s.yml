# =============================================================================
# Composition experiment, Kubernetes flavor (experiments/frappe-oci-composition/k8s/).
#
# Same model as the Docker Compose workflow (composition.yml), but the
# identical OCI artifacts are consumed by a real Kubernetes cluster instead
# of compose (issue #3: both flavors consume the same artifacts):
#   1. builds the composed runtime + per-app payload artifact images
#      (same Dockerfile, same targets as the compose flavor),
#   2. boots a kind cluster with native Kubernetes image volumes
#      (stable in k8s v1.36 — issue #3 section 7),
#   3. installs an RWX provisioner (nfs-server-provisioner) so the mutable
#     sites PVC can be shared by the init Job, web/workers and nginx,
#   4. applies the manifests, waits for the init Job (site create + app
#      installs + migration using exactly the release artifacts), then
#   5. smoke-tests the live stack through nginx.
#
# Runs when: the k8s dir (or this workflow) changes on main, a base image
# version is published to the ghcr `frappe` package, or manually.
# Own pushes go to the `fayolex-composed` package, which is filtered out,
# so no trigger loop.
# =============================================================================
name: Composition Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'experiments/frappe-oci-composition/k8s/**'
      - 'experiments/frappe-oci-composition/docker-compose/Dockerfile'
      - '.github/workflows/composition-k8s.yml'
  workflow_dispatch:
  registry_package:
    types: [published]

permissions:
  contents: read
  packages: write

# Push and registry_package can fire for the same logical change; collapse
# duplicates so only the newest run builds.
concurrency:
  group: composition-k8s-${{ github.repository }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Relative to the job's working-directory (experiments/frappe-oci-composition).
  CONTEXT: docker-compose
  NAMESPACE: frappe-composition
  CLUSTER: frappe-k8s
  # k8s >= v1.36: native image volumes are stable (issue #3 section 7).
  NODE_IMAGE: kindest/node:v1.36.4

jobs:
  k8s:
    name: Kind deploy, init & smoke test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'registry_package' ||
      github.event.package.name == 'frappe'
    defaults:
      run:
        working-directory: experiments/frappe-oci-composition
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build composed runtime + app payload artifacts
        run: |
          docker build -t composed-frappe-granian:latest "$CONTEXT"
          docker build --target artifact-erpnext \
            -t composed/erpnext:latest "$CONTEXT"
          docker build --target artifact-hrms \
            -t composed/hrms:latest "$CONTEXT"
          docker build --target artifact-fayolex_extension \
            -t composed/fayolex_extension:latest "$CONTEXT"
          docker build --target artifact-eps \
            -t composed/eps:latest "$CONTEXT"
          docker build --target artifact-fayolex_ds \
            -t composed/fayolex_decision_science_tools:latest "$CONTEXT"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: ${{ env.CLUSTER }}
          node_image: ${{ env.NODE_IMAGE }}
          wait: 120s

      - name: Load composed images into the cluster
        run: |
          kind load docker-image \
            composed-frappe-granian:latest \
            composed/erpnext:latest \
            composed/hrms:latest \
            composed/fayolex_extension:latest \
            composed/eps:latest \
            composed/fayolex_decision_science_tools:latest \
            --name "${CLUSTER}"

      - name: Install RWX storage provisioner
        run: |
          helm repo add nfs-ganesha-server-and-external-provisioner \
            https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner/
          helm install nfs-provisioner \
            nfs-ganesha-server-and-external-provisioner/nfs-server-provisioner \
            --set storageClass.create=true \
            --set storageClass.name=nfs-rwx \
            --set storageClass.archiveOnDelete=false
          # The chart ships a StatefulSet; wait for it by label, then confirm
          # the StorageClass is registered.
          kubectl -n default wait --for=jsonpath='{.status.readyReplicas}'=1 \
            statefulset -l app=nfs-server-provisioner --timeout=180s
          kubectl get storageclass nfs-rwx

      - name: Apply infrastructure (namespace, db, redis, config, storage)
        run: |
          kubectl apply -f k8s/00-namespace.yaml \
                        -f k8s/10-mariadb.yaml \
                        -f k8s/11-redis.yaml \
                        -f k8s/20-config.yaml \
                        -f k8s/30-storage.yaml
          kubectl -n "$NAMESPACE" rollout status statefulset/mariadb --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deploy/redis --timeout=180s

      - name: Run init job (site, app installs, migration)
        run: |
          kubectl apply -f k8s/31-init-job.yaml
          # Fail fast on a failed release instead of waiting out the timeout.
          kubectl -n "$NAMESPACE" wait job/init \
            --for=condition=failed --timeout=5s && {
            echo "❌ init job failed"; kubectl -n "$NAMESPACE" logs job/init || true; exit 1; } || true
          kubectl -n "$NAMESPACE" wait job/init \
            --for=condition=complete --timeout=25m
          kubectl -n "$NAMESPACE" logs job/init | tail -50

      - name: Apply runtime (web, workers, schedule, socketio, nginx)
        run: |
          kubectl apply -f k8s/40-runtime.yaml \
                        -f k8s/50-nginx.yaml
          for d in web worker worker-long worker-short schedule socketio nginx; do
            kubectl -n "$NAMESPACE" rollout status "deploy/$d" --timeout=300s
          done

      - name: Test live API ping via nginx
        run: |
          SUCCESS=0
          NGINX_POD=$(kubectl -n "$NAMESPACE" get pod -l app=nginx -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 60); do
            STATUS=$(kubectl -n "$NAMESPACE" exec "$NGINX_POD" -c nginx -- \
              curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:8080/api/method/ping" || true)
            echo "Waiting for live API... (status: $STATUS, attempt $i/60)"
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/method/ping returned HTTP 200 through nginx"
              SUCCESS=1
              break
            fi
            if [ $((i % 10)) -eq 1 ]; then
              echo "--- Diagnostics (attempt $i) ---"
              kubectl -n "$NAMESPACE" get pods -o wide
            fi
            sleep 5
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Live API ping failed. Logs:"
            kubectl -n "$NAMESPACE" logs deploy/web --tail=100 || true
            kubectl -n "$NAMESPACE" logs "$NGINX_POD" --tail=100 || true
            kubectl -n "$NAMESPACE" describe pod "$NGINX_POD" || true
            exit 1
          fi

      - name: Test bench + installed apps inside running stack
        run: |
          WEB_POD=$(kubectl -n "$NAMESPACE" get pod -l app=web -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NAMESPACE" exec "$WEB_POD" -c web -- bash -c '
            set -e
            cd /home/frappe/frappe-bench
            bench --site "${SITE_NAME:-crm.localhost}" list-apps
            env/bin/python -c "import frappe; print(\"frappe\", frappe.__version__)"
          '

      - name: Enforce hashed asset contract via nginx (no assets.json)
        run: |
          # nginx reads assets from the sites PVC + the read-only app image mounts.
          # Bundle filenames are hashed (esbuild entryNames "[dir]/[name].[hash]",
          # see patches/0007-drop-assets-json-manifest.patch) but no assets.json
          # manifest ships: python derives the name -> hashed-path map from the
          # dist trees at runtime. Assert the manifest is gone, every logical
          # bundle name resolves to exactly one hashed file on disk, and that
          # hashed file (plus the standalone static assets) serves HTTP 2xx.
          NGINX_POD=$(kubectl -n "$NAMESPACE" get pod -l app=nginx -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NAMESPACE" exec -i "$NGINX_POD" -c nginx -- python3 - <<'EOS'
          import glob, os, subprocess, sys
          sites = "/home/frappe/frappe-bench/sites"
          manifest = os.path.join(sites, "assets", "assets.json")
          if os.path.lexists(manifest):
              print(f"❌ {manifest} still present - the manifest must not ship")
              sys.exit(1)
          print("✅ no assets.json manifest in the image or on the sites volume")

          failed = []

          def check(label, url_path):
              r = subprocess.run(
                  ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                   f"http://127.0.0.1:8080{url_path}"],
                  capture_output=True, text=True)
              code = r.stdout or "000"
              if code[:1] != "2":
                  print(f"❌ {label} -> {url_path} returned HTTP {code}")
                  failed.append((label, url_path, code))
              else:
                  print(f"✅ {label} -> {url_path} (HTTP {code})")

          def resolve(app, kind, name):
              # esbuild emits "<name>.<hash>.<ext>"; .map files are excluded so
              # exactly one bundle file must match, exactly like the runtime map.
              # NOTE: glob.glob does NOT expand {js,css} braces — the ext is
              # derived from the kind instead.
              ext = "js" if kind == "js" else "css"
              pattern = os.path.join(sites, "assets", app, "dist", kind,
                                     f"{name}.*.{ext}")
              matches = [p for p in glob.glob(pattern) if not p.endswith(".map")]
              return matches

          # Every composition app's known bundles are asserted: the runtime map is
          # derived from the dist trees, so a name can only 404 if the app
          # artifact actually failed to ship that bundle.
          bundle_checks = [
              ("frappe", "js", "desk.bundle"),
              ("frappe", "css", "desk.bundle"),
              ("frappe", "css", "login.bundle"),
              ("frappe", "css", "print.bundle"),
              ("frappe", "js", "frappe-web.bundle"),
              ("frappe", "css", "website.bundle"),
              ("frappe", "js", "form.bundle"),
              ("frappe", "js", "controls.bundle"),
              ("frappe", "js", "list.bundle"),
              ("frappe", "js", "libs.bundle"),
              ("erpnext", "js", "erpnext.bundle"),
              ("erpnext", "css", "erpnext.bundle"),
              ("erpnext", "css", "erpnext-web.bundle"),
              ("erpnext", "css", "erpnext_email.bundle"),
              ("erpnext", "js", "bank-reconciliation-tool.bundle"),
              ("erpnext", "js", "point-of-sale.bundle"),
              ("hrms", "js", "hrms.bundle"),
              ("hrms", "css", "hrms.bundle"),
              ("hrms", "js", "hierarchy-chart.bundle"),
              ("hrms", "js", "performance.bundle"),
              ("hrms", "js", "interview.bundle"),
              ("eps", "js", "eps.bundle"),
              ("eps", "css", "eps.bundle"),
              # RTL css bundles are keyed rtl_<name> and served from css-rtl/;
              # frappe emits these links for rtl locales, so they must serve too.
              ("frappe", "css-rtl", "desk.bundle"),
              ("frappe", "css-rtl", "login.bundle"),
              ("frappe", "css-rtl", "website.bundle"),
              ("erpnext", "css-rtl", "erpnext.bundle"),
              ("hrms", "css-rtl", "hrms.bundle"),
              ("eps", "css-rtl", "eps.bundle"),
          ]
          print(f"Enforcing hashed bundle contract ({len(bundle_checks)} checks)...")
          for app, kind, name in bundle_checks:
              matches = resolve(app, kind, name)
              if len(matches) != 1:
                  print(f"❌ {app}:{name} ({kind}) matched {len(matches)} files on disk, expected 1")
                  failed.append((app, name, f"{len(matches)} matches"))
                  continue
              check(f"{app}:bundle", "/" + os.path.relpath(matches[0], sites))

          # Unhashed logical paths must NOT be served: the hash segment is the
          # content contract, so an old cached URL without it should 404.
          unhashed = "/assets/frappe/dist/js/desk.bundle.js"
          r = subprocess.run(
              ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
               f"http://127.0.0.1:8080{unhashed}"], capture_output=True, text=True)
          code = r.stdout or "000"
          if code == "200":
              print(f"❌ unhashed {unhashed} served HTTP 200 - esbuild must emit hashed names")
              failed.append(("unhashed", unhashed, code))
          else:
              print(f"✅ unhashed {unhashed} not served (HTTP {code})")

          # Enforce standalone image format contract:
          # Verify known static public assets across all apps return HTTP 2xx via nginx
          static_checks = [
              ("frappe", "/assets/frappe/images/frappe-framework-logo.svg"),
              ("erpnext", "/assets/erpnext/icons/desktop_icons/solid/subscription.svg"),
              ("erpnext", "/assets/erpnext/images/Logo.svg"),
              ("hrms", "/assets/hrms/frontend/manifest.webmanifest"),
              ("hrms", "/assets/hrms/frontend/index.html"),
              ("eps", "/assets/eps/images/eps.svg"),
          ]
          print(f"Enforcing standalone image static asset contract ({len(static_checks)} checks)...")
          for app, static_url in static_checks:
              check(f"{app}:static", static_url)

          if failed:
              print("❌ Asset contract validation failed:")
              for name, p, code in failed:
                  print(f"  {name} ({p}) HTTP {code}")
              sys.exit(1)
          print("✅ No manifest, and all hashed bundles + static public assets serve HTTP 2xx through nginx")
          EOS

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER}"
