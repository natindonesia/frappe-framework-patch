# Migrated from frappe/.github/workflows/build-docker.yml.
# This repository builds the checked-out Frappe submodule after applying local patches.
name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push to DigitalOcean Container Registry
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  REGISTRY_URL: registry.digitalocean.com
  REGISTRY_NAMESPACE: natindonesia
  IMAGE_NAME: frappe

permissions:
  contents: read

jobs:
  test-build:
    name: Build and test patched Frappe image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate patch application
        run: |
          bash -n scripts/*.sh tests/run_tests.sh
          bash scripts/verify-patches.sh
          bash tests/run_tests.sh --no-otel

      - name: Compute image metadata
        run: |
          upstream_sha="$(git -C frappe rev-parse --short=12 HEAD)"
          patch_sha="$(git rev-parse --short=12 HEAD)"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "PATCH_REPO_SHA=$patch_sha" >> "$GITHUB_ENV"
          echo "IMAGE=\${REGISTRY_URL}/\${REGISTRY_NAMESPACE}/\${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMMUTABLE_TAG=\${upstream_sha}-\${patch_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        run: |
          docker buildx build \
            --load \
            --build-arg UPSTREAM_SHA="$UPSTREAM_SHA" \
            --build-arg PATCH_REPO_SHA="$PATCH_REPO_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t frappe:latest \
            .

      - name: Test Python runtime
        run: |
          docker run --rm frappe:latest python -c \
            'import frappe; print(f"Frappe version: {frappe.__version__}")'

      - name: Test queue runtime
        run: |
          docker run --rm frappe:latest bash -c 'echo frappe > apps.txt &&
            python -m frappe.utils.bench_helper frappe worker --help'

      - name: Image size report
        run: |
          docker images frappe:latest --format 'Image: {{.Repository}}:{{.Tag}} Size: {{.Size}}'

  push-registry:
    name: Push patched Frappe image
    needs: test-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute image metadata
        run: |
          upstream_sha="$(git -C frappe rev-parse --short=12 HEAD)"
          patch_sha="$(git rev-parse --short=12 HEAD)"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "PATCH_REPO_SHA=$patch_sha" >> "$GITHUB_ENV"
          echo "IMAGE=\${REGISTRY_URL}/\${REGISTRY_NAMESPACE}/\${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMMUTABLE_TAG=\${upstream_sha}-\${patch_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push immutable and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            UPSTREAM_SHA=${{ env.UPSTREAM_SHA }}
            PATCH_REPO_SHA=${{ env.PATCH_REPO_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.IMMUTABLE_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=frappe-framework-patch
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.natindonesia.frappe.upstream-sha=${{ env.UPSTREAM_SHA }}
            org.natindonesia.frappe.patch-sha=${{ env.PATCH_REPO_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        run: |
          echo "Published $IMAGE:$IMMUTABLE_TAG and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream Frappe: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Patch repository: $PATCH_REPO_SHA" >> "$GITHUB_STEP_SUMMARY"
