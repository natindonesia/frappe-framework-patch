# Build Docker Image Workflow
#
# Container Registry Configuration
# ==================================
# Configure the following Secrets/Variables in GitHub (or use defaults):
#
# Variables (optional):
# - REGISTRY_URL: Hostname of registry (default: registry.digitalocean.com)
# - REGISTRY_NAMESPACE: Repository namespace/org (default: natindonesia)
#
# Secrets (required for push):
# - REGISTRY_USERNAME (or DIGITALOCEAN_EMAIL)
# - REGISTRY_PASSWORD (or DIGITALOCEAN_ACCESS_TOKEN)
#
# Migrated from frappe/.github/workflows/build-docker.yml to this patch
# repository. This repository builds the Frappe submodule after applying local
# patches (the Dockerfile applies ./patches to ./frappe before bench init).
# =============================================================================

name: Build Docker Image

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to Registry'
        required: false
        default: false
        type: boolean

env:
  DOCKER_BUILDKIT: 1
  REGISTRY_URL: ${{ vars.REGISTRY_URL || 'registry.digitalocean.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'natindonesia' }}

jobs:
  test-build:
    name: Build & Test Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository with Frappe submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build local Docker image
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t frappe:latest \
            .

      - name: Test Nginx runtime & static asset serving
        run: |
          docker run --rm frappe:latest bash -c "
            /usr/local/bin/nginx-entrypoint.sh & pid=\$! &&
            sleep 2 &&
            ASSET_PATH=\$(jq -r '.\"desk.bundle.js\"' sites/assets/assets.json) &&
            echo \"Found manifest reference desk.bundle.js -> \${ASSET_PATH}\" &&
            STATUS_DESK=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080\${ASSET_PATH}) &&
            STATUS_ACE=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/frappe/node_modules/ace-builds/src-min-noconflict/ace.js) &&
            kill \$pid &&
            if [ \"\$STATUS_DESK\" = \"200\" ] && [ \"\$STATUS_ACE\" = \"200\" ]; then
              echo \"✅ Nginx served asset manifest reference \${ASSET_PATH} and ace.js successfully (HTTP 200)\"
            else
              echo \"❌ Nginx static asset test failed (Desk: \$STATUS_DESK, Ace: \$STATUS_ACE)\" && exit 1
            fi
          "

      - name: Test Socket.io runtime
        run: |
          docker run --rm frappe:latest bash -c "
            export PATH=/home/frappe/.nvm/versions/node/v24.13.0/bin:\$PATH &&
            OUTPUT=\$(node /home/frappe/frappe-bench/apps/frappe/socketio.js 2>&1 | grep 'Realtime service listening') &&
            if [ -n \"\$OUTPUT\" ]; then
              echo '✅ Socket.io runtime test passed: '\$OUTPUT
            else
              echo '❌ Socket.io runtime test failed' && exit 1
            fi
          "

      - name: Test Gunicorn & Python runtime
        run: |
          docker run --rm frappe:latest bash -c "
            ./env/bin/gunicorn --version &&
            ./env/bin/python -c 'import frappe; print(f\"Frappe version: {frappe.__version__}\")'
          "

      - name: Test Queue / Worker runtime
        run: |
          docker run --rm frappe:latest bash -c "
            cd sites &&
            ../env/bin/python -m frappe.utils.bench_helper frappe worker --help
          "

      - name: Image size report
        run: |
          docker images frappe:latest --format "Image: {{.Repository}}:{{.Tag}}\nSize: {{.Size}}"

# =============================================================================
# compose-integration job
#
# Brings up the FULL docker compose stack from the freshly built image (no
# pre-baked site data in the image — the init one-shot provisions everything),
# then asserts:
#   1. init provisions the site (up -d blocks on init service_completed_successfully)
#   2. OTLP spans arrive at the collector from BOTH legs:
#      frappe-nginx (ngx_otel_module, OTLP/gRPC :4317) and
#      frappe-app (Python exporter, OTLP/HTTP :4318), with one shared trace ID
#      carrying both service names (W3C traceparent continuity).
#   3. Gate-off: with OTEL_EXPORTER_OTLP_ENDPOINT + NGINX_OTEL_ENDPOINT both
#      empty, nginx logs "OpenTelemetry disabled" and ZERO new spans appear.
#
# VOLUMES POLICY: teardown is always `down` WITHOUT -v. The ci-otel_mariadb-data
# / ci-otel_sites-data volumes persist between runs BY DESIGN: run 1 exercises
# the fresh-init path, every later run exercises the idempotent path
# (fix-db-users + migrate). Both paths get coverage for free. If a poisoned
# volume ever wedges CI, the fix is a manual `docker volume rm ci-otel_*`
# (never automated, never `down -v`).
# =============================================================================

  compose-integration:
    name: Compose init & OTEL integration
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: compose-integration-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # test-build built + --load'ed the image as frappe:latest with the layer
      # cache. Reuse it (services are pinned to image: frappe:latest in
      # compose.ci.yml) so we DON'T rebuild from source every run. If the tag is
      # missing (e.g. a different runner), rebuild with the SAME buildx cache
      # command so the cache is recognized and re-seeded.
      - name: Ensure compose images (reuse test-build frappe:latest if present)
        run: |
          if docker image inspect frappe:latest >/dev/null 2>&1; then
            echo "reusing frappe:latest from test-build (no rebuild)"
          else
            echo "frappe:latest not present locally — building (with layer cache)"
            docker buildx build \
              --load \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              -t frappe:latest \
              .
          fi

      - name: Cleanup lingering containers
        run: docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml down -v --remove-orphans || true

      - name: Start DB, Redis & OTEL Collector
        run: |
          HTTP_PORT=18085 docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml up -d mariadb redis otel-collector

      - name: Run init container explicitly (live logs)
        run: |
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 HTTP_PORT=18085 \
            docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml run --rm init

      - name: Start remaining stack (OTEL on)
        run: |
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 NGINX_OTEL_ENDPOINT=otel-collector:4317 HTTP_PORT=18085 \
            docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml up -d web socketio worker schedule worker-long worker-short nginx

      - name: Wait for web readiness
        run: |
          ok=""
          for i in $(seq 1 30); do
            code=$(docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml exec -T nginx curl -s -o /dev/null -w "%{http_code}" -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping || true)
            [ "$code" = "200" ] && ok=1 && break
            sleep 2
          done
          [ -n "$ok" ] || { docker compose -p ci-otel logs web nginx; exit 1; }
          echo "web ready (HTTP 200)"

      - name: Assert OTEL spans (both legs + shared trace)
        run: |
          # Trigger a request both legs service (app answers HTTP 200 pong).
          docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml exec -T nginx curl -s -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping
          # The collector batches traces (send-batch-timeout 5s), so on a cold
          # start its debug-exporter log is empty — or holds only nginx error
          # spans from the readiness loop (502s before web was up) — until a full
          # batch flushes. Poll until ONE trace id carries BOTH the nginx and the
          # app leg; otherwise the assert races the first flush / a stray 502.
          for i in $(seq 1 20); do
            trace_map=$(docker compose -p ci-otel logs otel-collector | awk '
              /service\.name: Str\(/ {
                s=$0; sub(/.*service\.name: Str\(/,"",s); sub(/\).*/,"",s); svc=s
              }
              /Trace ID[[:space:]]*:/ { gsub(/.*: /,""); print $1, svc }
            ' | sort -u)
            trace=$(echo "$trace_map" | awk '
              { t=$1; s=$2; svc[t","s]=1; have[t]=1 }
              END { for (t in have) if (svc[t",frappe-nginx"] && svc[t",frappe-app"]) { print t; exit } }
            ')
            [ -n "$trace" ] && break
            sleep 2
          done
          if [ -n "$trace" ]; then
            echo "trace continuity OK: $trace (frappe-nginx + frappe-app)"
            exit 0
          fi
          # ---- failure diagnostics: reveal WHICH leg is missing ----
          echo "::error::no trace carried BOTH frappe-nginx + frappe-app after 40s of polling"
          echo "--- collected (trace, service) pairs ---"
          if [ -n "$trace_map" ]; then
            echo "$trace_map"
            [ -n "$(echo "$trace_map" | grep ' frappe-nginx$')" ] || echo "MISSING: zero frappe-nginx (nginx) traces reached the collector"
            [ -n "$(echo "$trace_map" | grep ' frappe-app$')" ]   || echo "MISSING: zero frappe-app (gunicorn) traces reached the collector"
          else
            echo "(collector log produced no (trace, service) pairs — collector empty/never flushed)"
          fi
          echo "--- otel-collector log: line count + tail 60 ---"
          docker compose -p ci-otel logs otel-collector | wc -l
          docker compose -p ci-otel logs --tail 60 otel-collector || true
          echo "--- nginx endpoint env ---"
          docker compose -p ci-otel exec -T nginx sh -c 'echo nginx NGINX_OTEL_ENDPOINT=[$NGINX_OTEL_ENDPOINT] OTLP=[$OTEL_EXPORTER_OTLP_ENDPOINT]' || true
          echo "--- web/app endpoint env ---"
          docker compose -p ci-otel exec -T web sh -c 'echo web OTLP=[$OTEL_EXPORTER_OTLP_ENDPOINT] OTEL_SERVICE_NAME=[$OTEL_SERVICE_NAME]' || true
          exit 1

      - name: Assert gate-off (no spans when endpoint empty)
        run: |
          before=$(docker compose -p ci-otel logs --since 1m otel-collector | grep -c 'Span #' || true)
          # Gate off for the WHOLE stack (empty endpoints) — mirrors "start the
          # stack without OTEL". Re-uping only web+nginx would leave workers
          # tracing with their old env, polluting the zero-new-span assertion.
          OTEL_EXPORTER_OTLP_ENDPOINT= NGINX_OTEL_ENDPOINT= HTTP_PORT=18085 \
            docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml up -d
          sleep 10   # container recreate + a couple of requests below
          docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml exec -T nginx curl -s -o /dev/null -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping
          docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml exec -T nginx curl -s -o /dev/null -H "Host: crm.localhost" http://127.0.0.1:8080/api/method/ping
          after=$(docker compose -p ci-otel logs --since 1m otel-collector | grep -c 'Span #' || true)
          docker compose -p ci-otel logs nginx | grep -q 'OpenTelemetry disabled' || { echo "gate-off log missing"; exit 1; }
          [ "$after" -le "$before" ] || { echo "spans leaked with gate off: $before -> $after"; exit 1; }
          echo "gate-off OK (spans: $before -> $after)"

      # MUST run BEFORE teardown: teardown removes all containers, so any dump
      # after it captures nothing (bug once bitten). On failure, capture live
      # container logs — otel-collector especially — before down.
      - name: Diagnostic dump on failure
        if: failure()
        run: |
          docker compose -p ci-otel ps -a || true
          echo "--- otel-collector logs ---"
          docker compose -p ci-otel logs otel-collector || true
          echo "--- web/nginx logs ---"
          docker compose -p ci-otel logs web nginx || true

      - name: Teardown
        if: always()
        run: |
          docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml down --remove-orphans
          # NEVER pass -v: ci-otel volumes persist so later runs exercise the idempotent init path

  push-registry:
    name: Push to Registry
    needs: [test-build, compose-integration]
    if: ${{ github.event_name != 'pull_request' && (inputs.push_to_registry == true || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DIGITALOCEAN_EMAIL }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Push Docker image
        run: |
          REGISTRY="${REGISTRY_URL}/${REGISTRY_NAMESPACE}"
          FULL_TAG="${REGISTRY}/frappe:latest"
          SHA_TAG="${REGISTRY}/frappe:${GITHUB_SHA::7}"
          echo "Pushing to ${REGISTRY}/frappe"

          docker buildx build \
            --push \
            --cache-from type=gha \
            -t ${FULL_TAG} \
            .