# Mechanical enforcement of the scripts/ freeze.
#
# The CI entrypoints under scripts/ are frozen: pipeline behaviour is changed in
# .github/workflows/ only. This workflow fails the run when a push or pull
# request modifies anything under scripts/, so the rule cannot decay into a
# convention someone forgets. Delete this workflow to lift the freeze.
name: Guard - scripts/ is frozen

on:
  push:
    branches: [main]
    paths: ['scripts/**']
  pull_request:
    paths: ['scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    name: 'Reject changes under scripts/'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Fail when scripts/ is modified
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "no comparable base commit ($base); nothing to enforce"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA" -- scripts/)"
          if [ -n "$changed" ]; then
            echo "::error::scripts/ is frozen — pipeline changes belong in .github/workflows/"
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "OK: no changes under scripts/"
