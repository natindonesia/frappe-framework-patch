version: 2

updates:
  # GitHub Actions used by the build/test/publish and update workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in Dockerfile (python:*-slim-*) and Dockerfile.granian.
  # The Frappe dependency trees (frappe/package.json, frappe/pyproject.toml)
  # live in the pinned submodule, which is a separate repository, so they are
  # intentionally NOT monitored here — bump the submodule instead.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - docker
    groups:
      docker-base-images:
        patterns: ["*"]
