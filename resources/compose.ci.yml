# CI-only overlay for the consolidated build-images.yml vanilla (gunicorn) leg.
# Usage: docker compose -p ci-otel -f docker-compose.yml -f resources/compose.ci.yml up -d
# NOTE: requires compose >= v2.24 for the !override tag (v5.3.1 on this runner).
#
# IMAGE TAGGING (why every app/nginx service pins image: frappe:latest):
# build-images.yml builds the root Dockerfile and --load's it as frappe:latest
# (with the local layer cache) in the SAME job before this stack boots. Pinning
# these services to that one tag makes the compose-integration stage REUSE the
# exact image under test instead of rebuilding all 8 service images from source
# into throwaway ci-otel-* tags. Net effect: "build once, test the real image".
services:
  otel-collector:
    ports: !override []   # keep OTLP internal to the compose network; avoids host port collisions on shared runners
  init:
    image: frappe:latest
  web:
    image: frappe:latest
    deploy:
      replicas: 1         # faster bring-up; horizontal scaling is not under test here
  worker:
    image: frappe:latest
    deploy:
      replicas: 1
  worker-long:
    image: frappe:latest
  worker-short:
    image: frappe:latest
    deploy:
      replicas: 1
  schedule:
    image: frappe:latest
  socketio:
    image: frappe:latest
  nginx:
    image: frappe:latest
