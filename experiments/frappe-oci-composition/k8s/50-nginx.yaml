# nginx — port of compose `nginx` service. Serves static assets from the
# sites PVC (the assets.json manifest copied there by init, plus the per-app
# symlinks sites/assets/<app> -> apps/<app>/<app>/public, which resolve
# through this pod's own read-only app image mounts — same scheme as compose).
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: frappe-composition
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: frappe-composition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: composed-frappe-granian:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/nginx-entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: frappe-env
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8080
              httpHeaders:
                - name: Host
                  value: crm.localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: 8080
              httpHeaders:
                - name: Host
                  value: crm.localhost
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            # App asset trees — read-only image mounts so the sites-volume
            # symlinks resolve without copying any asset file.
            - name: apps-erpnext
              mountPath: /home/frappe/frappe-bench/apps/erpnext
              readOnly: true
            - name: apps-hrms
              mountPath: /home/frappe/frappe-bench/apps/hrms
              readOnly: true
            - name: apps-fayolex-extension
              mountPath: /home/frappe/frappe-bench/apps/fayolex_extension
              readOnly: true
            - name: apps-eps
              mountPath: /home/frappe/frappe-bench/apps/eps
              readOnly: true
            - name: apps-fayolex-ds
              mountPath: /home/frappe/frappe-bench/apps/fayolex_decision_science_tools
              readOnly: true
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: sites-data
            readOnly: true
        - name: apps-erpnext
          image:
            reference: composed/erpnext:latest
            pullPolicy: Never
        - name: apps-hrms
          image:
            reference: composed/hrms:latest
            pullPolicy: Never
        - name: apps-fayolex-extension
          image:
            reference: composed/fayolex_extension:latest
            pullPolicy: Never
        - name: apps-eps
          image:
            reference: composed/eps:latest
            pullPolicy: Never
        - name: apps-fayolex-ds
          image:
            reference: composed/fayolex_decision_science_tools:latest
            pullPolicy: Never
